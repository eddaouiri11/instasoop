<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Instagram Style Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Main app container - Instagram style */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 600px;
            background: #000000;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .login-card {
            width: 90%;
            max-width: 350px;
            text-align: center;
            padding: 20px;
        }

        .insta-logo {
            font-size: 3.5rem;
            font-family: 'Grand Hotel', cursive;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        #usernameInput {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #262626;
            background: #121212;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        #usernameInput:focus {
            border-color: #0095f6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:active { opacity: 0.7; }

        /* Banned Screen */
        #banned-screen {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 5000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        /* Instagram Header */
        .insta-header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid #262626;
            background: #000000;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-icon {
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            color: white;
        }

        .avatar-gradient {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
            padding: 2px;
        }

        .avatar-inner {
            background: #000000;
            border-radius: 50%;
            padding: 1px;
        }

        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info h2 {
            font-size: 15px;
            font-weight: 700;
            color: white;
            line-height: 1.3;
        }

        .user-info p {
            font-size: 11px;
            color: #8e8e8e;
        }

        .header-actions {
            display: flex;
            gap: 22px;
        }

        .header-actions span {
            font-size: 24px;
            cursor: pointer;
            color: white;
        }

        /* Chat Box */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #000000;
        }

        /* Profile Section inside chat */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .big-avatar-gradient {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-radius: 50%;
            padding: 3px;
            margin-bottom: 12px;
        }

        .big-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
            padding: 2px;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-top: 6px;
        }

        .profile-username {
            font-size: 13px;
            color: #8e8e8e;
        }

        .view-profile-btn {
            margin-top: 12px;
            padding: 6px 18px;
            background: #262626;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Message Bubbles - Instagram Style */
        .msg {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            animation: popIn 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .sent {
            align-self: flex-end;
        }

        .recv {
            align-self: flex-start;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .sent .bubble {
            background: #3797F0;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .recv .bubble {
            background: #262626;
            color: white;
            border: 0.5px solid #363636;
            border-bottom-left-radius: 5px;
        }

        .seen-status {
            font-size: 10px;
            color: #8e8e8e;
            margin-top: 4px;
            padding-left: 8px;
        }

        /* Input Footer - Instagram Style */
        .input-footer {
            padding: 12px 16px;
            background: #000000;
            border-top: 0.5px solid #262626;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #262626;
            border-radius: 28px;
            padding: 6px 16px;
            border: 0.5px solid #363636;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #8e8e8e;
        }

        .camera-icon {
            background: #3797F0;
            border-radius: 50%;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .camera-icon span {
            font-size: 18px;
            color: white;
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
            padding: 10px 0;
        }

        #msgInput::placeholder {
            color: #8e8e8e;
        }

        .action-icons {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .action-icons span {
            font-size: 22px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .action-icons span:active { opacity: 0.6; }

        .send-btn {
            color: #3797F0;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* Admin Panel */
        #admin-panel {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 6000;
            display: none;
            flex-direction: column;
            padding: 24px;
            color: white;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .admin-user-card {
            border-bottom: 0.5px solid #262626;
            padding: 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ban-btn {
            background: #ff4444;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .nuclear-btn {
            background: #dc2743;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Scrollbar hidden */
        #chat-box::-webkit-scrollbar {
            width: 0;
        }

        /* Timer */
        #timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f09433;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <div class="insta-logo">Instasoop</div>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" autocomplete="off">
            <button class="login-btn" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Banned Screen -->
    <div id="banned-screen">
        <div style="font-size: 5rem;">🚫</div>
        <h2 style="margin: 20px 0; color:white;">الحساب محظور</h2>
        <div id="timer-display">--:--</div>
    </div>

    <!-- Main Chat App - Instagram Style -->
    <div id="chat-app">
        <!-- Instagram Header -->
        <div class="insta-header">
            <div class="header-left">
                <div class="back-icon" onclick="alert('Back action')">←</div>
                <div class="avatar-gradient">
                    <div class="avatar-inner">
                        <img id="headerAvatar" class="avatar-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="avatar">
                    </div>
                </div>
                <div class="user-info">
                    <h2 id="headerName">Sara Ahmed</h2>
                    <p id="headerStatus">Active now</p>
                </div>
            </div>
            <div class="header-actions">
                <span>📞</span>
                <span>📹</span>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-box">
            <!-- Profile intro section -->
            <div class="profile-section">
                <div class="big-avatar-gradient">
                    <img id="profileAvatar" class="big-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=default" alt="avatar">
                </div>
                <div class="profile-name" id="profileName">Sara Ahmed</div>
                <div class="profile-username" id="profileUsername">@sara_designer</div>
                <button class="view-profile-btn" onclick="alert('View profile')">View profile</button>
            </div>
            <!-- Dynamic messages injected here -->
        </div>

        <!-- Input Footer -->
        <div class="input-footer">
            <div class="input-wrapper">
                <div class="camera-icon" onclick="alert('Camera')">
                    <span>📷</span>
                </div>
                <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
                <div class="action-icons" id="actionIcons">
                    <span>🎤</span>
                    <span>🖼️</span>
                    <span>❤️</span>
                </div>
                <button class="send-btn" id="sendBtn" style="display: none;">Send</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2>المستخدمين</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">✕</button>
        </div>
        <div id="admin-list" style="flex:1; overflow-y:auto;"></div>
        <button class="nuclear-btn" onclick="nuclearWipe()">مسح الشات بالكامل</button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "Unknown";

        // Dynamic avatar/name based on user
        function updateUserProfile(username) {
            const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
            document.getElementById('headerAvatar').src = avatarUrl;
            document.getElementById('profileAvatar').src = avatarUrl;
            document.getElementById('headerName').innerText = username;
            document.getElementById('profileName').innerText = username;
            document.getElementById('profileUsername').innerText = `@${username}`;
            document.getElementById('headerStatus').innerText = "Active now";
        }

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch(e) {}
            
            const saved = localStorage.getItem('instasoop_session');
            if(saved) checkStatus(saved);
            else document.getElementById('login-screen').style.display = 'flex';
            
            // Toggle send button when typing
            const msgInput = document.getElementById('msgInput');
            const actionIcons = document.getElementById('actionIcons');
            const sendBtn = document.getElementById('sendBtn');
            msgInput.addEventListener('input', function() {
                if(this.value.trim().length > 0) {
                    actionIcons.style.display = 'none';
                    sendBtn.style.display = 'block';
                } else {
                    actionIcons.style.display = 'flex';
                    sendBtn.style.display = 'none';
                }
            });
            
            // Send on Enter
            msgInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') send();
            });
            
            sendBtn.addEventListener('click', () => send());
        }

        function startApp() {
            const n = document.getElementById('usernameInput').value.trim();
            if(n.length >= 2) checkStatus(n);
            else alert("اسم المستخدم لازم يكون حرفين على الأقل");
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const b = snap.val();
                if(b && b.expiry && Date.now() > b.expiry) {
                    db.ref('banned_users/' + name).remove();
                } else if(b) {
                    document.getElementById('chat-app').style.display = 'none';
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('banned-screen').style.display = 'flex';
                    startTimer(b.expiry);
                    return;
                }
                
                if(!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    updateUserProfile(name);
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMsgs();
                    
                    // Also remove any lingering banned screen
                    document.getElementById('banned-screen').style.display = 'none';
                }
            });
        }

        function loadMsgs() {
            db.ref('messages').limitToLast(150).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                // Keep profile section at top
                const profileDiv = box.querySelector('.profile-section');
                const newBox = document.createElement('div');
                newBox.id = 'chat-box';
                newBox.style.flex = '1';
                newBox.style.overflowY = 'auto';
                newBox.style.padding = '16px 12px';
                newBox.style.display = 'flex';
                newBox.style.flexDirection = 'column';
                newBox.style.gap = '12px';
                newBox.style.background = '#000000';
                
                // Clone profile section
                const profileClone = profileDiv.cloneNode(true);
                newBox.appendChild(profileClone);
                
                let messagesArray = [];
                snap.forEach(m => {
                    messagesArray.push(m.val());
                });
                messagesArray.reverse().forEach(d => {
                    const isMe = d.user === currentUser;
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    msgDiv.innerHTML = `
                        <div class="bubble">${escapeHtml(d.text)}</div>
                        ${isMe ? '<div class="seen-status">Seen</div>' : ''}
                    `;
                    newBox.appendChild(msgDiv);
                });
                
                // Replace chat box
                const parent = box.parentNode;
                parent.replaceChild(newBox, box);
                newBox.scrollTop = newBox.scrollHeight;
                
                // Re-attach listener for scroll
                window.chatBoxElement = newBox;
            });
        }
        
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if(m === '&') return '&amp;';
                if(m === '<') return '&lt;';
                if(m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(text === "20102010") { openAdmin(); input.value = ""; document.getElementById('actionIcons').style.display = 'flex'; document.getElementById('sendBtn').style.display = 'none'; return; }
            if(!text) return;
            
            db.ref('messages').push({ user: currentUser, text: text, ts: Date.now() });
            input.value = "";
            // toggle icons back
            document.getElementById('actionIcons').style.display = 'flex';
            document.getElementById('sendBtn').style.display = 'none';
            
            // scroll after send
            setTimeout(() => {
                if(window.chatBoxElement) window.chatBoxElement.scrollTop = window.chatBoxElement.scrollHeight;
                else {
                    const box = document.getElementById('chat-box');
                    if(box) box.scrollTop = box.scrollHeight;
                }
            }, 50);
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const listDiv = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                listDiv.innerHTML = "";
                snap.forEach(u => {
                    const name = u.key;
                    listDiv.innerHTML += `
                        <div class="admin-user-card">
                            <div>@${name}</div>
                            <div>
                                <button class="ban-btn" style="background:#ff8c42;" onclick="applyBan('${name}', 60)">1د</button>
                                <button class="ban-btn" style="background:#ff5555;" onclick="applyBan('${name}', 3600)">1س</button>
                                <button class="ban-btn" style="background:#aa2e2e;" onclick="applyBan('${name}', 0)">مؤبد</button>
                            </div>
                        </div>`;
                });
            });
        }
        
        function applyBan(userName, seconds) {
            const expiry = seconds === 0 ? null : Date.now() + (seconds * 1000);
            db.ref('banned_users/' + userName).set({ expiry: expiry });
            // Also remove from active
            db.ref('active_users/' + userName).remove();
            if(userName === currentUser) {
                alert("تم حظر حسابك");
                localStorage.removeItem('instasoop_session');
                location.reload();
            }
        }
        
        function nuclearWipe() {
            if(confirm("⚠️ هل أنت متأكد من مسح جميع الرسائل؟")) {
                db.ref('messages').remove();
            }
        }
        
        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }
        
        function startTimer(expiry) {
            if(!expiry) { 
                document.getElementById('timer-display').innerText = "FOREVER"; 
                return;
            }
            const interval = setInterval(() => {
                const diff = expiry - Date.now();
                if(diff <= 0) {
                    clearInterval(interval);
                    location.reload();
                }
                const mins = Math.floor(diff / 60000);
                const secs = Math.floor((diff % 60000) / 1000);
                document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }, 1000);
        }

        init();
    </script>
</body>
</html>
