<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Clean & Fast</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --blue-action: #0095f6;
            --bg-light: #ffffff;
            --border: #dbdbdb;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            height: 100vh; 
            width: 100vw; 
            background: #fafafa;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Screen Login */
        #login-screen {
            position: fixed; inset: 0;
            background: #fff;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 3000;
        }

        .login-card {
            width: 90%; max-width: 350px;
            text-align: center;
            padding: 20px;
        }

        .insta-logo { 
            font-size: 3.5rem; 
            font-family: 'Grand Hotel', cursive; 
            margin-bottom: 30px;
            display: block;
        }

        /* App Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        header {
            height: 60px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 1.8rem;
            color: #262626;
        }

        /* Chat Container */
        #chat-box {
            flex: 1;
            overflow-y: scroll; /* Standard scroll */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #fff;
        }

        /* Message Styling - NO ANIMATIONS */
        .msg { 
            max-width: 85%; 
            display: flex; 
            flex-direction: column; 
        }

        .u-name { 
            font-size: 0.7rem; 
            color: #8e8e8e; 
            margin-bottom: 2px; 
            padding: 0 4px;
        }
        
        .bubble { 
            padding: 8px 14px; 
            border-radius: 18px; 
            font-size: 0.95rem; 
            line-height: 1.4;
            word-wrap: break-word;
        }

        .sent { align-self: flex-end; }
        .sent .bubble { 
            background: #efefef; 
            color: #262626; 
            border-bottom-right-radius: 4px; 
        }
        
        .recv { align-self: flex-start; }
        .recv .bubble { 
            background: #fff; 
            color: #262626; 
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px; 
        }

        /* Bottom Input */
        .input-area {
            padding: 10px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrap {
            border: 1px solid var(--border);
            border-radius: 25px;
            display: flex;
            padding: 4px 16px;
            align-items: center;
            background: #fff;
        }

        #msgInput { 
            flex: 1; 
            border: none; 
            outline: none; 
            padding: 10px 0; 
            font-size: 15px; 
        }
        
        .send-btn { 
            color: var(--blue-action); 
            font-weight: 700; 
            cursor: pointer; 
            margin-right: 10px;
            user-select: none;
        }

        /* Admin UI */
        #admin-panel {
            position: fixed; inset: 0; background: #fff; z-index: 6000;
            display: none; flex-direction: column; padding: 20px;
        }
        .admin-user-card { border-bottom: 1px solid #eee; padding: 10px 0; }
        .ban-btn { border: none; padding: 6px 12px; border-radius: 4px; margin-left: 5px; cursor: pointer; font-weight: bold; }

        #banned-screen {
            position: fixed; inset: 0; background: #fff; z-index: 5000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-screen">
        <div class="login-card">
            <span class="insta-logo">Instasoop</span>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" style="width:100%; padding:14px; border-radius:8px; border:1px solid var(--border); margin-bottom:15px; outline:none;">
            <button onclick="startApp()" style="width:100%; padding:14px; background:var(--blue-action); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Banned Screen -->
    <div id="banned-screen">
        <div style="font-size:5rem;">🚫</div>
        <h2 style="margin:20px 0;">الحساب محظور</h2>
        <div id="timer-display" style="font-size:2.5rem; font-weight:bold; color:red;">--:--</div>
    </div>

    <!-- Main Chat App -->
    <div id="chat-app">
        <header>
            <div class="header-logo">Instasoop</div>
            <div id="displayUser" style="color:var(--blue-action); font-weight:600;"></div>
        </header>

        <div id="chat-box">
            <!-- Messages load here -->
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div class="send-btn" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>المستخدمين</h2>
            <button onclick="closeAdmin()">✕</button>
        </div>
        <div id="admin-list" style="flex:1; overflow-y:auto; margin:20px 0;"></div>
        <button onclick="nuclearWipe()" style="background:red; color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">مسح الشات</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "Unknown";

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch(e) {}
            
            const saved = localStorage.getItem('instasoop_session');
            if(saved) checkStatus(saved);
            else document.getElementById('login-screen').style.display = 'flex';
        }

        function startApp() {
            const n = document.getElementById('usernameInput').value.trim();
            if(n.length >= 2) checkStatus(n);
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const b = snap.val();
                if(b) {
                    if(b.expiry && Date.now() > b.expiry) {
                        db.ref('banned_users/' + name).remove();
                    } else {
                        document.getElementById('chat-app').style.display = 'none';
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('banned-screen').style.display = 'flex';
                        startTimer(b.expiry);
                        return;
                    }
                }
                
                if(!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + name;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMsgs();
                }
            });
        }

        function loadMsgs() {
            // Instant load - No animation
            db.ref('messages').limitToLast(100).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                
                snap.forEach(m => {
                    const d = m.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `
                        <span class="u-name">${d.user}</span>
                        <div class="bubble">${d.text}</div>
                    `;
                    box.appendChild(div);
                });

                // Force scroll to bottom immediately
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const i = document.getElementById('msgInput');
            const t = i.value.trim();
            if(t === "20102010") { openAdmin(); i.value = ""; return; }
            if(!t) return;
            db.ref('messages').push({ user: currentUser, text: t, ts: Date.now() });
            i.value = "";
            // Instant scroll for the sender
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', snap => {
                list.innerHTML = "";
                snap.forEach(u => {
                    const n = u.key;
                    list.innerHTML += `
                        <div class="admin-user-card">
                            <div>@${n}</div>
                            <button class="ban-btn" style="background:#ffcccc" onclick="applyBan('${n}', 60)">1د</button>
                            <button class="ban-btn" style="background:#ff9999" onclick="applyBan('${n}', 3600)">1س</button>
                            <button class="ban-btn" style="background:#ff4444" onclick="applyBan('${n}', 0)">مؤبد</button>
                        </div>`;
                });
            });
        }

        function applyBan(n, s) {
            const expiry = s === 0 ? null : Date.now() + (s * 1000);
            db.ref('banned_users/' + n).set({ expiry: expiry });
        }

        function nuclearWipe() { if(confirm("مسح كلشي؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        function startTimer(expiry) {
            if(!expiry) { document.getElementById('timer-display').innerText = "FOREVER"; return; }
            setInterval(() => {
                const diff = expiry - Date.now();
                if(diff <= 0) location.reload();
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        document.getElementById('msgInput').addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
        init();
    </script>
</body>
</html>
