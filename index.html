<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Pro Mobile</title>
    
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --bg-black: #000000;
            --card-grey: #121212;
            --border-grey: #262626;
            --text-grey: #a8a8a8;
            --msg-recv: #262626;
            --msg-sent: linear-gradient(135deg, #3797f0 0%, #2c7be5 100%);
            --danger: #ff3b30;
            --warning: #ffcc00;
            --success: #34c759;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100vw;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .insta-logo {
            font-size: clamp(3rem, 15vw, 4.5rem);
            font-family: 'Grand Hotel', cursive;
            margin-bottom: 30px;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-card {
            width: 100%;
            max-width: 350px;
        }

        #usernameInput {
            width: 100%;
            padding: 16px;
            background: #1a1a1a;
            border: 1px solid var(--border-grey);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
            text-align: center;
            transition: border-color 0.3s;
        }

        #usernameInput:focus {
            border-color: #444;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--insta-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        /* Main Chat Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .insta-header {
            height: 60px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-grey);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }
        .avatar-img { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            background: #222;
            padding: 2px;
            border: 1px solid #333;
        }
        .user-info h2 { font-size: 14px; font-weight: 700; }
        .user-info p { font-size: 10px; color: var(--success); }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px; /* Space for input */
        }

        .msg { max-width: 85%; display: flex; flex-direction: column; }
        .sent { align-self: flex-end; }
        .recv { align-self: flex-start; }

        .msg-user {
            font-size: 10px;
            color: var(--text-grey);
            margin: 0 8px 3px;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .sent .bubble { 
            background: var(--msg-sent); 
            color: white; 
            border-bottom-right-radius: 4px;
        }
        
        .recv .bubble { 
            background: var(--msg-recv); 
            color: white; 
            border-bottom-left-radius: 4px;
        }

        /* Footer Input */
        .input-footer { 
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); 
            background: var(--bg-black);
            border-top: 0.5px solid var(--border-grey);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #121212;
            border-radius: 25px;
            padding: 2px 14px;
            border: 1px solid #262626;
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px 0;
            font-size: 15px;
        }

        .send-btn { 
            color: var(--insta-blue); 
            font-weight: 700; 
            background: none; 
            border: none; 
            font-size: 15px; 
            margin-right: 10px;
            display: none;
        }

        /* Admin UI - Mobile Optimized */
        #admin-panel {
            position: fixed; inset: 0; background: #000; z-index: 10001;
            display: none; flex-direction: column; padding: 15px;
        }

        .admin-list-container { flex: 1; overflow-y: auto; margin: 15px 0; }
        .admin-card {
            background: #0a0a0a; padding: 12px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid #1a1a1a;
        }
        .admin-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ban-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .ban-btn { padding: 8px; border-radius: 8px; border: none; font-size: 11px; font-weight: 600; }

        /* Banned Screen */
        #banned-screen {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 40px;
        }
        .timer-display { font-size: 48px; font-weight: 800; color: var(--warning); margin: 20px 0; }

        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 8px 20px; border-radius: 20px;
            font-size: 13px; font-weight: 600; z-index: 20000; display: none;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- Login -->
    <div id="login-screen">
        <div class="insta-logo">Instasoop</div>
        <div class="login-card">
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="login-btn" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Main Chat -->
    <div id="chat-app">
        <div class="insta-header">
            <div class="header-left">
                <img id="headerAvatar" class="avatar-img" src="" alt="">
                <div class="user-info">
                    <h2 id="headerName">...</h2>
                    <p>متصل الآن</p>
                </div>
            </div>
            <div class="header-right">
                <span style="font-size: 18px; color: white;">🛡️</span>
            </div>
        </div>

        <div id="chat-box"></div>

        <div class="input-footer">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
                <button id="sendBtn" class="send-btn" onclick="send()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>لوحة التحكم</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; color:white; font-size:24px;">✕</button>
        </div>
        <div class="admin-list-container" id="admin-list"></div>
        <button onclick="nuclearWipe()" style="background:var(--danger); color:white; padding:15px; border-radius:12px; border:none; font-weight:bold;">حذف كافة الرسائل</button>
    </div>

    <!-- Banned Screen -->
    <div id="banned-screen">
        <span style="font-size: 64px;">🚫</span>
        <h2>تم تقييد حسابك</h2>
        <div class="timer-display" id="timer-display">00:00</div>
        <p style="color:var(--text-grey); font-size:14px;">لقد انتهكت قوانين الدردشة.</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = localStorage.getItem('instasoop_name') || "";

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 2000);
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val.length < 2) return showToast("الاسم قصير");
            currentUser = val;
            checkBanStatus(val);
        }

        function checkBanStatus(name) {
            db.ref('banned_users/' + name).on('value', (s) => {
                const b = s.val();
                if(b && b.expiry && Date.now() < b.expiry) {
                    showBanned(b.expiry);
                } else {
                    if(document.getElementById('banned-screen').style.display === 'flex') location.reload();
                    initChat(name);
                }
            });
        }

        function initChat(name) {
            localStorage.setItem('instasoop_name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = `https://api.dicebear.com/7.x/micah/svg?seed=${name}`;
            document.getElementById('headerName').innerText = name;
            
            db.ref('active_users/' + name).set({ ts: Date.now() });
            
            // Real-time Message Listener
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    const isMe = m.user === currentUser;
                    const d = document.createElement('div');
                    d.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    d.innerHTML = `
                        ${!isMe ? `<div class="msg-user">${m.user}</div>` : ''}
                        <div class="bubble">${m.text}</div>
                    `;
                    box.appendChild(d);
                });
                if(isAtBottom) box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;

            if(txt === "20102010") return openAdmin();

            db.ref('messages').push({
                user: currentUser,
                text: txt,
                ts: Date.now()
            });
            input.value = "";
            document.getElementById('sendBtn').style.display = 'none';
        }

        document.getElementById('msgInput').oninput = function() {
            document.getElementById('sendBtn').style.display = this.value.trim() ? 'block' : 'none';
        };

        document.getElementById('msgInput').onkeypress = (e) => { if(e.key==='Enter') send(); };

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            db.ref('active_users').on('value', (s) => {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                s.forEach(u => {
                    const d = document.createElement('div');
                    d.className = 'admin-card';
                    d.innerHTML = `
                        <div class="admin-card-top">
                            <strong>@${u.key}</strong>
                            <button onclick="ban('${u.key}', -1)" style="color:var(--success); background:none; border:none; font-weight:bold;">فك الحظر</button>
                        </div>
                        <div class="ban-actions">
                            <button class="ban-btn" style="background:#eee" onclick="ban('${u.key}', 30)">30 ثانية</button>
                            <button class="ban-btn" style="background:#ddd" onclick="ban('${u.key}', 3600)">1 ساعة</button>
                            <button class="ban-btn" style="background:var(--danger); color:white" onclick="ban('${u.key}', 0)">دائم</button>
                            <button class="ban-btn" style="background:#333; color:white" onclick="kick('${u.key}')">طرد</button>
                        </div>
                    `;
                    list.appendChild(d);
                });
            });
        }

        function ban(user, sec) {
            if(sec === -1) {
                db.ref('banned_users/' + user).remove();
                return showToast("تم فك الحظر");
            }
            const exp = sec === 0 ? 9999999999999 : Date.now() + (sec * 1000);
            db.ref('banned_users/' + user).set({ expiry: exp });
            showToast("تم تنفيذ الحظر");
        }

        function kick(user) { db.ref('active_users/' + user).remove(); showToast("تم الطرد"); }
        function nuclearWipe() { if(confirm("مسح الكل؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function showBanned(exp) {
            document.getElementById('chat-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('banned-screen').style.display = 'flex';
            
            const timer = setInterval(() => {
                const diff = exp - Date.now();
                if(diff <= 0) { clearInterval(timer); location.reload(); }
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('timer-display').innerText = exp > 2000000000000 ? "مؤبد" : `${m}:${s<10?'0'+s:s}`;
            }, 1000);
        }

        if(currentUser) checkBanStatus(currentUser);
    </script>
</body>
</html>
