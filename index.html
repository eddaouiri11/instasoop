<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Inner Animation</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --blue-action: #0095f6;
            --text-main: #262626;
            --text-secondary: #8e8e8e;
            --border-color: #dbdbdb;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        html, body { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            overflow: hidden; 
            background: #fafafa;
            display: flex;
            justify-content: center;
        }

        /* Background Animation for Login */
        #login-screen {
            position: fixed; inset: 0;
            background: var(--insta-gradient);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 3000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%; max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .insta-logo { 
            font-size: 3.5rem; 
            font-family: 'Grand Hotel', cursive; 
            margin-bottom: 20px; 
            display: block;
            color: var(--text-main);
        }

        /* App Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 500px;
            background: #fff;
            position: relative;
        }

        header {
            height: 60px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #efefef;
            background: #fff;
            z-index: 10;
        }

        .header-logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 2rem;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Chat Box with Internal Animation */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            background: #ffffff;
            overflow-x: hidden;
        }

        /* Inner Floating Icons */
        .inner-bg-anim {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.15; }
            80% { opacity: 0.15; }
            100% { transform: translateY(-500px) rotate(360deg); opacity: 0; }
        }

        .floating-icon {
            position: absolute;
            bottom: -50px;
            animation: floatUp 8s linear infinite;
        }

        .floating-icon svg {
            width: 30px; height: 30px;
            fill: url(#grad1);
        }

        /* Messages */
        .msg { max-width: 80%; display: flex; flex-direction: column; z-index: 5; }
        .u-name { font-size: 0.75rem; color: #8e8e8e; margin-bottom: 2px; font-weight: 600; padding: 0 5px; }
        
        .bubble { 
            padding: 10px 15px; 
            border-radius: 20px; 
            font-size: 0.95rem; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        .sent { align-self: flex-end; }
        .sent .bubble { 
            background: var(--insta-gradient); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }
        
        .recv { align-self: flex-start; }
        .recv .bubble { 
            background: rgba(239, 239, 239, 0.9); 
            color: #262626; 
            border-bottom-left-radius: 4px; 
        }

        /* Input Area */
        .input-area {
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid #efefef;
            background: #fff;
            z-index: 10;
        }

        .input-wrap {
            border: 1px solid #dbdbdb;
            border-radius: 25px;
            display: flex;
            padding: 5px 15px;
            align-items: center;
        }

        #msgInput {
            flex: 1; border: none; outline: none; padding: 8px 0; font-size: 15px; background: transparent;
        }

        .send-btn { color: var(--blue-action); font-weight: 700; cursor: pointer; padding-left: 5px; }

        /* Banned & Admin */
        #banned-screen {
            position: fixed; inset: 0; background: #fff; z-index: 5000;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        #admin-panel {
            position: fixed; inset: 0; background: #fff; z-index: 6000;
            display: none; flex-direction: column; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- SVG Defs for Icons -->
    <svg style="width:0;height:0;position:absolute;">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f09433;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#bc1888;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Login -->
    <div id="login-screen">
        <div class="login-card">
            <span class="insta-logo">Instasoop</span>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" style="width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; margin-bottom:15px; outline:none;">
            <button onclick="startApp()" style="width:100%; padding:12px; background:var(--blue-action); color:white; border:none; border-radius:10px; font-weight:bold;">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Banned -->
    <div id="banned-screen">
        <h1 style="font-size:4rem;">🚫</h1>
        <h2>تم حظرك</h2>
        <div id="timer-display" style="font-size:3rem; font-weight:bold; color:var(--blue-action);">00</div>
    </div>

    <!-- Main App -->
    <div id="chat-app">
        <header>
            <div class="header-logo">Instasoop</div>
            <div id="displayUser" style="color:var(--blue-action); font-weight:bold;"></div>
        </header>

        <div id="chat-box">
            <!-- Icons will be injected here -->
            <div class="inner-bg-anim" id="innerAnim"></div>
        </div>

        <div class="input-area">
            <div class="input-wrap">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div class="send-btn" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between;">
            <h3>لوحة التحكم</h3>
            <button onclick="closeAdmin()">✕</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1; margin-top:20px;"></div>
        <button onclick="nuclearWipe()" style="background:red; color:white; padding:15px; border:none; border-radius:10px; margin-top:10px;">تصفير الشات</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "Unknown";

        // Function to create inner floating icons
        function createInnerIcons() {
            const container = document.getElementById('innerAnim');
            const iconSvg = `<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c.796 0 1.441.645 1.441 1.44s-.645 1.44-1.441 1.44c-.795 0-1.439-.645-1.439-1.44s.644-1.44 1.439-1.44z"/></svg>`;
            
            setInterval(() => {
                const div = document.createElement('div');
                div.className = 'floating-icon';
                div.style.left = Math.random() * 90 + '%';
                div.style.bottom = "-50px";
                div.style.animationDuration = (Math.random() * 4 + 6) + 's';
                div.innerHTML = iconSvg;
                container.appendChild(div);
                
                setTimeout(() => div.remove(), 10000);
            }, 1500);
        }

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {}

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkStatus(saved);
            else document.getElementById('login-screen').style.display = 'flex';
            
            createInnerIcons();
        }

        function startApp() {
            const n = document.getElementById('usernameInput').value.trim();
            if(n.length >= 2) checkStatus(n);
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const b = snap.val();
                if(b) {
                    if(b.expiry && Date.now() > b.expiry) db.ref('banned_users/' + name).remove();
                    else {
                        document.getElementById('chat-app').style.display = 'none';
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('banned-screen').style.display = 'flex';
                        if(b.expiry) startTimer(b.expiry);
                        return;
                    }
                }
                
                if(!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + name;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMsgs();
                }
            });
        }

        function loadMsgs() {
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                const container = document.getElementById('innerAnim');
                box.innerHTML = '';
                box.appendChild(container); // Keep animation container
                
                snap.forEach(m => {
                    const d = m.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const i = document.getElementById('msgInput');
            const t = i.value.trim();
            if(t === "20102010") { openAdmin(); i.value = ""; return; }
            if(!t) return;
            db.ref('messages').push({ user: currentUser, text: t, ts: Date.now() });
            i.value = "";
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', snap => {
                list.innerHTML = "";
                snap.forEach(u => {
                    const name = u.key;
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; background:#f0f0f0; padding:10px; margin-bottom:5px; border-radius:10px;">
                        <span>${name}</span>
                        <div>
                            <button onclick="applyBan('${name}', 60)">1د</button>
                            <button onclick="applyBan('${name}', 0)">طرد</button>
                        </div>
                    </div>`;
                });
            });
        }

        function applyBan(n, s) {
            const exp = s === 0 ? null : Date.now() + (s * 1000);
            db.ref('banned_users/' + n).set({ expiry: exp });
        }

        function nuclearWipe() { db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        function startTimer(e) { setInterval(() => { 
            const d = e - Date.now(); 
            if(d > 0) document.getElementById('timer-display').innerText = Math.floor(d/1000);
            else location.reload();
        }, 1000); }

        document.getElementById('msgInput').addEventListener('keypress', e => { if(e.key === 'Enter') send(); });
        init();
    </script>
</body>
</html>
