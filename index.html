<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Ultra Premium</title>
    
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --insta-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --bg-black: #000000;
            --card-grey: #121212;
            --border-grey: #262626;
            --text-grey: #a8a8a8;
            --msg-recv: #262626;
            --msg-sent: linear-gradient(to left, #3797f0, #2c7be5);
            --danger: #ff3b30;
            --warning: #ffcc00;
            --success: #34c759;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: white;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .insta-logo {
            font-size: 4.5rem;
            font-family: 'Grand Hotel', cursive;
            margin-bottom: 40px;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-card {
            width: 85%;
            max-width: 350px;
            text-align: center;
        }

        #usernameInput {
            width: 100%;
            padding: 18px;
            background: var(--card-grey);
            border: 1px solid var(--border-grey);
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        #usernameInput:focus {
            border-color: #555;
            background: #1a1a1a;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: var(--insta-blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        /* Main Chat Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: var(--bg-black);
        }

        .insta-header {
            height: 65px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--border-grey);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar-img { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid #222; }
        .user-info h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
        .user-info p { font-size: 11px; color: var(--success); font-weight: 600; }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg { max-width: 80%; display: flex; flex-direction: column; }
        .sent { align-self: flex-end; }
        .recv { align-self: flex-start; }

        .msg-user {
            font-size: 11px;
            color: var(--text-grey);
            margin: 0 10px 4px;
            font-weight: 500;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .sent .bubble { 
            background: var(--msg-sent); 
            color: white; 
            border-bottom-right-radius: 4px;
        }
        
        .recv .bubble { 
            background: var(--msg-recv); 
            color: white; 
            border-bottom-left-radius: 4px;
            border: 0.5px solid #333;
        }

        /* Footer Input */
        .input-footer { 
            padding: 10px 16px 34px; 
            background: var(--bg-black);
            border-top: 0.5px solid var(--border-grey);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #1c1c1e;
            border-radius: 30px;
            padding: 4px 16px;
            border: 1px solid #2c2c2e;
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px 0;
            font-size: 15px;
        }

        .send-btn { 
            color: var(--insta-blue); 
            font-weight: 700; 
            background: none; 
            border: none; 
            font-size: 15px; 
            padding: 0 10px;
            display: none;
            cursor: pointer;
        }

        /* Admin UI */
        #admin-panel {
            position: fixed; inset: 0; background: #000; z-index: 10001;
            display: none; flex-direction: column; padding: 25px;
        }

        .admin-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }

        .admin-list-container {
            flex: 1; overflow-y: auto;
        }

        .admin-card {
            background: #111; padding: 16px; border-radius: 16px;
            margin-bottom: 12px; border: 1px solid #222;
        }

        .admin-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;}
        .admin-card-top span { font-weight: 700; color: var(--insta-blue); }

        .ban-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .ban-btn { 
            padding: 10px; border-radius: 10px; border: none; font-size: 12px; 
            font-weight: 700; cursor: pointer; color: #000;
        }

        /* Custom Toast */
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.9); color: black; padding: 12px 25px;
            border-radius: 30px; font-weight: 600; z-index: 20000; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Banned UI */
        #banned-screen {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px;
        }

        .timer-box {
            background: #111; padding: 20px 40px; border-radius: 20px;
            margin-top: 20px; border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- Login -->
    <div id="login-screen">
        <div class="insta-logo">Instasoop</div>
        <div class="login-card">
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="login-btn" onclick="startApp()">دخول</button>
        </div>
    </div>

    <!-- Main Chat -->
    <div id="chat-app">
        <div class="insta-header">
            <div class="header-left">
                <span style="font-size: 24px; font-weight: 300;">✕</span>
                <img id="headerAvatar" class="avatar-img" src="" alt="">
                <div class="user-info">
                    <h2 id="headerName">...</h2>
                    <p>● متصل الآن</p>
                </div>
            </div>
            <div class="header-right">
                <span style="font-size: 20px; margin-right: 15px;">📞</span>
                <span style="font-size: 20px; cursor: pointer;">📹</span>
            </div>
        </div>

        <div id="chat-box"></div>

        <div class="input-footer">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <button id="sendBtn" class="send-btn" onclick="send()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div class="admin-header">
            <h1 style="font-size: 28px;">الإدارة العليا</h1>
            <button onclick="closeAdmin()" style="background:none; border:none; color:white; font-size:35px;">✕</button>
        </div>
        
        <div class="admin-list-container" id="admin-list"></div>

        <button onclick="nuclearWipe()" style="background:var(--danger); color:white; padding:18px; border-radius:18px; margin-top:15px; border:none; font-weight:800; width:100%;">تصفير قاعدة البيانات</button>
    </div>

    <!-- Banned Screen -->
    <div id="banned-screen">
        <div style="font-size: 100px;">🛑</div>
        <h2 style="font-size: 28px; margin: 15px 0;">موقوف مؤقتاً</h2>
        <p style="color: var(--text-grey); max-width: 250px;">لقد خالفت معايير المجتمع الخاصة بـ Instasoop.</p>
        <div class="timer-box">
            <div id="timer-display" style="font-size: 40px; color: var(--warning); font-weight: 800;">00:00</div>
        </div>
        <p style="margin-top: 20px; font-size: 13px; color: #444;">حاول مرة أخرى عند انتهاء الوقت</p>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = localStorage.getItem('instasoop_name') || "";
        let banChecked = false;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val.length < 2) return showToast("الاسم قصير جداً");
            checkStatus(val);
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (s) => {
                const b = s.val();
                if(b && b.expiry && Date.now() < b.expiry) {
                    showBanned(b.expiry);
                } else {
                    if(document.getElementById('banned-screen').style.display === 'flex') {
                        location.reload(); // Re-enable app if unbanned
                    }
                    if(!currentUser || currentUser !== name || !banChecked) {
                        login(name);
                    }
                }
                banChecked = true;
            });
        }

        function login(name) {
            currentUser = name;
            localStorage.setItem('instasoop_name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            document.getElementById('headerName').innerText = name;
            
            db.ref('active_users/' + name).set({ 
                ts: firebase.database.ServerValue.TIMESTAMP,
                status: "online" 
            });
            loadMessages();
        }

        function loadMessages() {
            db.ref('messages').limitToLast(60).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach((child) => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `
                        ${!isMe ? `<div class="msg-user">${m.user}</div>` : ''}
                        <div class="bubble">${m.text}</div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;

            // Admin Command
            if(txt === "20102010") {
                openAdmin();
                input.value = "";
                return;
            }

            db.ref('messages').push({
                user: currentUser,
                text: txt,
                ts: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = "";
            document.getElementById('sendBtn').style.display = 'none';
        }

        document.getElementById('msgInput').addEventListener('input', function() {
            document.getElementById('sendBtn').style.display = this.value.trim() ? 'block' : 'none';
        });

        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') send();
        });

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            db.ref('active_users').on('value', (s) => {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                s.forEach((u) => {
                    const div = document.createElement('div');
                    div.className = 'admin-card';
                    div.innerHTML = `
                        <div class="admin-card-top">
                            <span>@${u.key}</span>
                            <button onclick="applyBan('${u.key}', -1)" style="background:var(--success); color:white; border:none; padding:5px 12px; border-radius:8px; font-weight:bold;">إلغاء الحظر</button>
                        </div>
                        <div class="ban-actions">
                            <button class="ban-btn" style="background:var(--warning)" onclick="applyBan('${u.key}', 30)">30 ثانية</button>
                            <button class="ban-btn" style="background:#ff9500" onclick="applyBan('${u.key}', 3600)">ساعة واحدة</button>
                            <button class="ban-btn" style="background:var(--danger); color:white;" onclick="applyBan('${u.key}', 0)">مؤبد</button>
                            <button class="ban-btn" style="background:#555; color:white;" onclick="kickUser('${u.key}')">طرد</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(user, sec) {
            if(sec === -1) {
                db.ref('banned_users/' + user).remove();
                showToast("تم إلغاء حظر " + user);
                return;
            }
            const exp = sec === 0 ? 9999999999999 : Date.now() + (sec * 1000);
            db.ref('banned_users/' + user).set({ expiry: exp });
            showToast("تم حظر " + user);
        }

        function kickUser(user) {
            db.ref('active_users/' + user).remove();
            showToast("تم طرد " + user);
        }

        function nuclearWipe() {
            if(confirm("سيتم حذف جميع الرسائل نهائياً، هل أنت متأكد؟")) {
                db.ref('messages').remove();
                showToast("تم مسح السجل");
            }
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function showBanned(exp) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'none';
            document.getElementById('banned-screen').style.display = 'flex';
            
            const updateTimer = () => {
                const diff = exp - Date.now();
                if(diff <= 0) {
                    location.reload();
                    return;
                }
                const h = Math.floor(diff/3600000);
                const m = Math.floor((diff%3600000)/60000);
                const s = Math.floor((diff%60000)/1000);
                
                let timeStr = "";
                if(h > 0) timeStr += `${h}:`;
                timeStr += `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                
                document.getElementById('timer-display').innerText = exp > 2000000000000 ? "مؤبد" : timeStr;
            };

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // Auto-Run
        if(currentUser) checkStatus(currentUser);

        // Responsive Fix
        window.addEventListener('resize', () => {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
