<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram | Instasoop</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --bg: #000000;
            --border: #262626;
            --text: #ffffff;
            --dim: #a8a8a8;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0; padding: 0; background: var(--bg);
            color: var(--text); height: 100%; width: 100%;
            overflow: hidden;
        }

        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 30px;
        }

        .logo-text {
            font-size: 3rem; font-weight: bold; font-style: italic;
            margin-bottom: 40px; color: white; letter-spacing: -2px;
        }

        input {
            width: 100%; background: #121212; border: 1px solid #363636;
            padding: 14px; border-radius: 8px; color: white;
            font-size: 0.85rem; margin-bottom: 15px; outline: none;
        }

        .btn-insta {
            width: 100%; background: var(--insta-blue); color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: 700; cursor: pointer;
        }

        #chat-app { 
            display: none; flex-direction: column; height: 100%; 
            max-width: 500px; margin: 0 auto;
        }

        header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.7rem; color: var(--dim); margin: 0 12px 2px; }
        .bubble { padding: 10px 16px; border-radius: 22px; font-size: 0.95rem; line-height: 1.4; }

        .sent { align-self: flex-end; }
        .sent .bubble { background: var(--insta-blue); color: white; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: #262626; color: white; border: 1px solid #333; }

        .input-area { padding: 12px; border-top: 1px solid var(--border); }
        .input-wrapper { background: #121212; border: 1px solid #363636; border-radius: 25px; display: flex; padding: 2px 15px; }
        #msgInput { border: none; background: transparent; flex: 1; color: white; padding: 10px 0; outline: none; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="logo-text">Instagram</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
        <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
        <p style="color: #444; font-size: 0.7rem; margin-top: 30px;">System Update: All Restrictions Lifted</p>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight: 800; font-size: 1.3rem;">Instasoop</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600;"></div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="رسالة..." autocomplete="off">
                <div style="color:var(--insta-blue); font-weight:bold; cursor:pointer; align-self:center;" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";

        // --- الميزة الأساسية: مسح جميع أنواع الحظر فوراً ---
        function clearAllRestrictions() {
            db.ref('banned_ips').remove();   // مسح حظر الـ IP
            db.ref('banned_users').remove(); // مسح حظر الأسماء
            console.log("All bans cleared successfully.");
        }

        async function init() {
            clearAllRestrictions(); // تشغيل المسح عند فتح التطبيق
            
            const saved = localStorage.getItem('instasoop_session');
            if (saved) {
                currentUser = saved;
                document.getElementById('displayUser').innerText = "@" + saved;
                showScreen('chat-app');
                loadMessages();
            } else {
                showScreen('login-screen');
            }
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) {
                currentUser = val;
                localStorage.setItem('instasoop_session', val);
                document.getElementById('displayUser').innerText = "@" + val;
                showScreen('chat-app');
                loadMessages();
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;
            db.ref('messages').push({ user: currentUser, text: input.value, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        init();
    </script>
</body>
</html>
