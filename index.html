<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --insta-gradient: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
            --msg-gradient: linear-gradient(to right, #0095f6, #0074cc);
            --bg: #ffffff;
            --border: #dbdbdb;
            --text: #262626;
            --dim: #8e8e8e;
            --danger: #ed4956;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100%; width: 100%; overflow: hidden; position: fixed; }

        /* Screens */
        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .insta-logo { font-size: 3.5rem; color: var(--text); font-family: 'Grand Hotel', cursive; margin-bottom: 20px; }

        input[type="text"] {
            width: 100%; max-width: 300px; background: #fafafa; border: 1px solid var(--border);
            padding: 14px; border-radius: 8px; color: var(--text); margin-bottom: 12px; outline: none; font-size: 14px;
        }

        .btn-insta {
            width: 100%; max-width: 300px; background: var(--insta-blue); color: white;
            border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px;
        }

        /* App Structure */
        #chat-app { display: none; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; background: #fff; }

        header {
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; height: 50px;
        }

        header .logo-text { font-family: 'Grand Hotel', cursive; font-size: 1.8rem; }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 6px; }
        
        /* Messages Styling */
        .msg { max-width: 80%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.65rem; color: var(--dim); margin-bottom: 2px; padding: 0 10px; }
        .bubble { padding: 10px 16px; border-radius: 22px; font-size: 0.95rem; line-height: 1.3; }

        .sent { align-self: flex-end; }
        .sent .bubble { background: var(--msg-gradient); color: white; border-bottom-right-radius: 4px; }
        .sent .u-name { text-align: left; display: none; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: #f1f1f1; color: var(--text); border-bottom-left-radius: 4px; }

        /* Input Area Fix */
        .input-area { 
            padding: 10px 16px 25px 16px; /* Added bottom padding for mobile home bar */
            border-top: 1px solid var(--border);
            background: #fff;
        }
        .input-wrapper { 
            border: 1px solid var(--border); border-radius: 30px; 
            display: flex; padding: 4px 16px; align-items: center; gap: 10px;
        }
        #msgInput { border: none; background: transparent; flex: 1; color: var(--text); padding: 10px 0; outline: none; margin:0; font-size: 15px; }
        .send-btn { color: var(--insta-blue); font-weight: 700; cursor: pointer; font-size: 15px; padding: 5px; }

        /* Admin */
        #admin-panel { position: fixed; inset: 0; background: #fff; z-index: 4000; display: none; flex-direction: column; padding: 20px; }
        .admin-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .ban-btns button { padding: 6px 10px; margin-right: 4px; border: 1px solid var(--border); border-radius: 5px; background: #fff; font-size: 12px; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="insta-logo">Instasoop</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
        <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
    </div>

    <div id="banned-screen" class="overlay-screen">
        <div style="font-size: 5rem;">🚫</div>
        <h2 style="color: var(--danger); margin: 10px 0;">تم حظر حسابك</h2>
        <p id="ban-msg" style="color: var(--dim); text-align: center;">حسابك محظور حالياً من استخدام الدردشة.</p>
        <div id="timer-display" style="font-weight: 800; color: var(--insta-blue); margin-top: 15px; font-size: 1.2rem;"></div>
    </div>

    <div id="chat-app">
        <header>
            <div class="logo-text">Instasoop</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600; font-size: 0.9rem;"></div>
        </header>
        
        <div id="chat-box"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div class="send-btn" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; align-items:center; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            <h2 style="margin:0;">التحكم في الأعضاء</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; font-size:1.5rem;">✕</button>
        </div>
        <div style="margin: 15px 0; display: flex; gap: 8px;">
            <button onclick="unbanAll()" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;">فك حظر الجميع</button>
            <button onclick="nuclearWipe()" style="flex:1; padding:10px; border-radius:8px; background:var(--danger); color:white; border:none;">مسح المحادثة</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "";
        const ADMIN_CODE = "20102010";

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) { userIP = "Unknown"; }

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkUserStatus(saved);
            else showScreen('login-screen');
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkUserStatus(val);
        }

        function checkUserStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const ban = snap.val();
                if (ban) {
                    const now = Date.now();
                    if (ban.expiry && now > ban.expiry) {
                        db.ref('banned_users/' + name).remove();
                    } else {
                        showScreen('banned-screen');
                        if (ban.expiry) startTimer(ban.expiry);
                        return;
                    }
                }
                
                if (!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + name;
                    showScreen('chat-app');
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMessages();
                }
            });
        }

        function startTimer(expiry) {
            const disp = document.getElementById('timer-display');
            const timer = setInterval(() => {
                const diff = expiry - Date.now();
                if (diff <= 0) { clearInterval(timer); location.reload(); }
                else {
                    const s = Math.floor(diff/1000);
                    disp.innerText = s + " ثانية متبقية";
                }
            }, 1000);
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (txt === ADMIN_CODE) { openAdmin(); input.value = ''; return; }
            if (!txt) return;
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(u => {
                    const n = u.key;
                    const div = document.createElement('div');
                    div.className = 'admin-item';
                    div.innerHTML = `<div><b>${n}</b></div>
                    <div class="ban-btns">
                        <button onclick="applyBan('${n}', 30)">30s</button>
                        <button onclick="applyBan('${n}', 3600)">1h</button>
                        <button onclick="applyBan('${n}', 0)" style="color:red">دائم</button>
                    </div>`;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(name, sec) {
            const exp = sec === 0 ? null : Date.now() + (sec*1000);
            db.ref('banned_users/' + name).set({ banned: true, expiry: exp });
        }

        function unbanAll() { db.ref('banned_users').remove(); }
        function nuclearWipe() { db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

        init();
    </script>
</body>
</html>
