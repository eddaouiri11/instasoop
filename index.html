<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع وحفظ الملفات</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; padding: 25px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background-color: #0056b3; }
        .admin-btn { background-color: #28a745; }
        .admin-btn:hover { background-color: #218838; }
        #filesList { margin-top: 20px; text-align: right; display: none; }
        .file-card { background: #eef2f5; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>رفع وحفظ الملفات</h2>

    <!-- قسم رفع الملفات للزائر -->
    <div id="uploadSection">
        <input type="file" id="fileInput" accept="image/*,application/pdf">
        <input type="text" id="userPin" placeholder="أدخل رمزًا أو كودًا خاصًا بك">
        <button onclick="uploadAndSave()">حفظ ورَفْع الملف</button>
    </div>

    <hr style="margin: 20px 0;">

    <!-- زر الأدمن لرؤية التحميلات -->
    <button class="admin-btn" onclick="accessAdminDownloads()">Downloads Stuff (خاص بالمشرف)</button>

    <!-- قائمة عرض الملفات المرفوعة -->
    <div id="filesList">
        <h3>قائمة الملفات المرفوعة:</h3>
        <div id="itemsContainer"></div>
    </div>
</div>

<script>
    // Configuration
    const ADMIN_CODE = "20102010";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
        authDomain: "instasoop-230e0.firebaseapp.com",
        databaseURL: "https://instasoop-230e0-default-rtdb.firebaseio.com",
        projectId: "instasoop-230e0",
        storageBucket: "instasoop-230e0.firebasestorage.app",
        messagingSenderId: "968767111628",
        appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const storage = firebase.storage();

    // 1. وظيفة الرفع والتخزين للزوار
    async function uploadAndSave() {
        const fileInput = document.getElementById('fileInput');
        const userPin = document.getElementById('userPin').value.trim();
        const file = fileInput.files[0];

        if (!file) {
            alert("يرجى اختيار ملف أولاً (صورة أو PDF)!");
            return;
        }
        if (!userPin) {
            alert("يرجى إدخال رمز أو كود خاص بك!");
            return;
        }

        try {
            // رفع الملف إلى Firebase Storage
            const storageRef = storage.ref('uploads/' + Date.now() + '_' + file.name);
            const uploadTask = await storageRef.put(file);
            const downloadURL = await uploadTask.ref.getDownloadURL();

            // حفظ بيانات الملف والرمز في Firebase Realtime Database
            const newFileRef = db.ref('user_uploads').push();
            await newFileRef.set({
                pin: userPin,
                fileName: file.name,
                fileUrl: downloadURL,
                uploadedAt: new Date().toLocaleString()
            });

            alert("تم حفظ الملف بنجاح!");
            fileInput.value = '';
            document.getElementById('userPin').value = '';
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء الرفع: " + error.message);
        }
    }

    // 2. وظيفة الأدمن لرؤية وتحميل ملفات جميع المستخدمين
    function accessAdminDownloads() {
        const inputCode = prompt("أدخل كود الأدمن للدخول إلى Downloads Stuff:");
        
        if (inputCode === ADMIN_CODE) {
            alert("تم التحقق بنجاح!");
            loadUploadedFiles();
        } else if (inputCode !== null) {
            alert("الرمز غير صحيح!");
        }
    }

    // 3. جلب وعرض القائمة للأدمن
    function loadUploadedFiles() {
        const filesListDiv = document.getElementById('filesList');
        const container = document.getElementById('itemsContainer');
        
        db.ref('user_uploads').once('value', (snapshot) => {
            container.innerHTML = '';
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.innerHTML = `
                        <p><strong>اسم الملف:</strong> ${data.fileName}</p>
                        <p><strong>رمز المستخدم (PIN):</strong> <span style="color:red; font-weight:bold;">${data.pin}</span></p>
                        <p><small>تاريخ الرفع: ${data.uploadedAt}</small></p>
                        <a href="${data.fileUrl}" target="_blank" download>تحميل الملف</a>
                    `;
                    container.appendChild(card);
                });
                filesListDiv.style.display = 'block';
            } else {
                container.innerHTML = '<p>لا توجد ملفات مرفوعة حالياً.</p>';
                filesListDiv.style.display = 'block';
            }
        });
    }
</script>

</body>
</html>
