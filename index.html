<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LUXY PRO | MOBILE EDITION</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --luxy-gold: linear-gradient(135deg, #d4af37 0%, #fcf6ba 45%, #aa771c 100%);
            --luxy-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(212, 175, 55, 0.3);
            --accent-gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--luxy-dark);
            color: #fff;
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed; /* Prevents bouncing on iOS */
        }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: var(--luxy-dark); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        .avatar-selector {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0;
            padding: 10px; background: var(--glass); border-radius: 20px; border: 1px solid var(--glass-border);
        }

        .avatar-option { width: 55px; height: 55px; border-radius: 50%; border: 2px solid transparent; transition: 0.3s; }
        .avatar-option.selected { border-color: var(--accent-gold); transform: scale(1.1); }

        /* Navbar */
        .luxy-navbar {
            height: 70px; padding: 0 20px; background: rgba(0,0,0,0.95);
            border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; z-index: 1000;
        }

        .user-info-box { display: flex; align-items: center; gap: 10px; }
        .nav-avatar { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--accent-gold); }

        /* Chat Area */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(to bottom, transparent, rgba(212,175,55,0.02));
            -webkit-overflow-scrolling: touch;
        }

        /* Bubbles */
        .msg { max-width: 85%; display: flex; gap: 8px; animation: slide 0.3s ease; }
        @keyframes slide { from { opacity: 0; transform: translateY(10px); } }
        
        .luxy-bubble {
            padding: 10px 14px; border-radius: 18px; position: relative;
            backdrop-filter: blur(5px); border: 1px solid var(--glass-border); font-size: 14px; line-height: 1.4;
        }

        .sent { align-self: flex-end; flex-direction: row-reverse; }
        .sent .luxy-bubble { background: rgba(40,40,40,0.9); border-right: 3px solid var(--accent-gold); border-bottom-right-radius: 4px; }
        
        .recv { align-self: flex-start; }
        .recv .luxy-bubble { background: rgba(255,255,255,0.05); border-bottom-left-radius: 4px; }

        /* Mobile Footer (The Fix) */
        .luxy-footer {
            padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); /* Handling iPhone notch/home bar */
            background: #000;
            border-top: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .input-wrapper {
            background: rgba(255,255,255,0.05); border-radius: 25px;
            display: flex; align-items: center; padding: 5px 12px;
            border: 1px solid rgba(212,175,55,0.2);
        }

        #msgInput {
            flex: 1; background: none; border: none; outline: none; color: white;
            padding: 10px; font-size: 16px; /* 16px prevents auto-zoom on iOS */
            text-align: right;
        }

        .send-btn {
            background: var(--luxy-gold); width: 38px; height: 38px; border-radius: 50%;
            border: none; display: flex; align-items: center; justify-content: center; margin-left: 8px;
        }

        /* Decorations */
        #decor-panel {
            display: none; position: absolute; bottom: 85px; left: 15px; right: 15px;
            background: #111; border: 1px solid var(--accent-gold); border-radius: 15px;
            padding: 12px; z-index: 2000;
        }

        .decor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .decor-opt { padding: 10px; background: #1a1a1a; border-radius: 10px; text-align: center; font-size: 12px; }

        .premium-decoration { position: absolute; inset: -2px; border-radius: 18px; z-index: -1; opacity: 0.4; filter: blur(5px); }
        .effect-gold { background: var(--luxy-gold); }
        .effect-fire { background: linear-gradient(#ff4e50, #f9d423); }
        .effect-lightning { background: linear-gradient(#00d2ff, #3a7bd5); }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-family:'Cinzel'; color:var(--accent-gold); font-size: 2.5rem;">LUXY</h1>
        <div class="avatar-selector" id="avatarList"></div>
        <input type="text" id="usernameInput" placeholder="لقبك الملكي..." 
               style="width:85%; padding:15px; background:var(--glass); border:1px solid var(--glass-border); border-radius:15px; color:white; text-align:center; margin-bottom:15px; outline:none; font-size:16px;">
        <button onclick="startApp()" style="width:85%; padding:15px; background:var(--luxy-gold); border:none; border-radius:30px; font-weight:800; color:black;">دخول المجلس</button>
    </div>

    <div id="chat-app" style="display:none; height:100%; flex-direction:column;">
        <nav class="luxy-navbar">
            <div class="user-info-box">
                <img id="headerAvatar" class="nav-avatar" src="">
                <h3 id="headerName" style="font-size:14px;">---</h3>
            </div>
            <span onclick="location.reload()" style="font-size:20px;">✨</span>
        </nav>

        <main id="chat-box"></main>

        <div id="decor-panel">
            <div class="decor-grid">
                <div class="decor-opt" onclick="setEffect('none')">عادي</div>
                <div class="decor-opt" onclick="setEffect('gold')">ذهبي ✨</div>
                <div class="decor-opt" onclick="setEffect('fire')">لهب 🔥</div>
                <div class="decor-opt" onclick="setEffect('lightning')">برق ⚡</div>
            </div>
        </div>

        <footer class="luxy-footer">
            <div class="input-wrapper">
                <span onclick="toggleDecor()" style="font-size:22px; cursor:pointer; margin-right:5px;">🎨</span>
                <input type="text" id="msgInput" placeholder="اكتب رسالتك..." autocomplete="off">
                <button onclick="send()" class="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const SEC_KEY = "luxy_ultra_secret_1337";
        let selectedAvatarUrl = "";
        let currentEffect = "none";

        // Generate Avatars
        const avatarContainer = document.getElementById('avatarList');
        for(let i=1; i<=8; i++) {
            const img = document.createElement('img');
            img.src = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=luxy${i}&backgroundColor=b6e3f4`;
            img.className = 'avatar-option';
            if(i===1) { img.classList.add('selected'); selectedAvatarUrl = img.src; }
            img.onclick = function() {
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                selectedAvatarUrl = this.src;
            };
            avatarContainer.appendChild(img);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            databaseURL: "https://instasoop-230e0-default-rtdb.firebaseio.com",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function encrypt(t) { return CryptoJS.AES.encrypt(t, SEC_KEY).toString(); }
        function decrypt(c) {
            try { return CryptoJS.AES.decrypt(c, SEC_KEY).toString(CryptoJS.enc.Utf8); }
            catch { return "رسالة مشفرة"; }
        }

        function toggleDecor() {
            const p = document.getElementById('decor-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function setEffect(e) { currentEffect = e; toggleDecor(); }

        function startApp() {
            const user = document.getElementById('usernameInput').value.trim();
            if(user.length < 2) return;
            localStorage.setItem('luxy_user', user);
            localStorage.setItem('luxy_avatar', selectedAvatarUrl);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = selectedAvatarUrl;
            document.getElementById('headerName').innerText = user;
            loadMessages();
        }

        function loadMessages() {
            db.ref('messages').limitToLast(30).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === localStorage.getItem('luxy_user');
                    const text = decrypt(m.text);
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    
                    let eff = m.effect && m.effect !== 'none' ? `<div class="premium-decoration effect-${m.effect}"></div>` : '';
                    
                    div.innerHTML = `
                        <img src="${m.avatar}" style="width:25px; height:25px; border-radius:50%; margin-top:5px;">
                        <div style="display:flex; flex-direction:column; ${isMe ? 'align-items:flex-end' : 'align-items:flex-start'}">
                            <span style="font-size:9px; color:#666; margin:0 5px;">${m.user}</span>
                            <div class="luxy-bubble">${eff}<span style="position:relative;">${text}</span></div>
                        </div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            db.ref('messages').push({
                user: localStorage.getItem('luxy_user'),
                avatar: localStorage.getItem('luxy_avatar'),
                text: encrypt(input.value.trim()),
                effect: currentEffect,
                ts: Date.now()
            });
            input.value = '';
            // Keeps focus on mobile after sending
            input.focus(); 
        }

        document.getElementById('msgInput').onkeypress = (e) => { if(e.key === 'Enter') send(); };

        // Handle keyboard showing up on mobile
        window.addEventListener('resize', () => {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
