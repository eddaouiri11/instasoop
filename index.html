<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08151f" />
  <title>RadioTalk</title>
  <style>
    :root {
      --bg: #07121d;
      --bg-2: #0b1826;
      --panel: rgba(14, 24, 36, 0.92);
      --panel-strong: rgba(18, 29, 44, 0.96);
      --panel-soft: rgba(13, 21, 30, 0.76);
      --line: rgba(130, 176, 211, 0.2);
      --text: #edf6ff;
      --muted: #9fb8ce;
      --green: #38d39f;
      --green-strong: #13b67a;
      --red: #ff5d5d;
      --red-strong: #e83a3a;
      --amber: #f7cc6d;
      --amber-strong: #df9d14;
      --blue: #6ca8ff;
      --shadow: rgba(0, 0, 0, 0.38);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #0d1b2a 0%, #08151f 40%, #040d16 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
      overflow: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, rgba(117, 154, 193, 0.28), rgba(61, 90, 116, 0.2));
      color: var(--text);
      border-radius: 16px;
      padding: 0.85rem 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(110, 168, 255, 0.42);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .screen {
      width: min(100%, 430px);
      min-height: min(100vh - 32px, 860px);
      min-height: min(100dvh - 32px, 860px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: relative;
    }

    .hidden { display: none !important; }

    .loading-screen {
      align-items: center;
      justify-content: center;
      background: rgba(6, 12, 18, 0.35);
      border-radius: 24px;
      border: 1px solid rgba(116, 167, 255, 0.16);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.34);
    }

    .loading-card {
      width: min(88%, 320px);
      padding: 24px 20px 18px;
      border-radius: 24px;
      background: rgba(12, 20, 31, 0.9);
      border: 1px solid rgba(122, 151, 177, 0.18);
      box-shadow: 0 14px 32px rgba(0,0,0,0.28);
      text-align: center;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      position: relative;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(49, 224, 177, 0.8), rgba(19, 182, 122, 0.88));
      box-shadow: 0 16px 28px rgba(19, 182, 122, 0.22);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.92);
      border-top-color: transparent;
      border-left-color: transparent;
      transform: rotate(35deg);
    }

    .brand-mark::after {
      inset: 29px;
      border-color: rgba(255,255,255,0.8);
      border-top-color: transparent;
      border-left-color: transparent;
    }

    .loading-label {
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 12px;
    }

    .loading-track {
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .loading-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--green), #9ef5d4);
      border-radius: inherit;
      transition: width 0.22s ease;
    }

    .app-shell {
      background: rgba(7, 18, 24, 0.72);
      border-radius: 28px;
      border: 1px solid rgba(146, 191, 255, 0.12);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.32);
      overflow: hidden;
      position: relative;
    }

    .auth-screen {
      padding: 24px 18px 18px;
      justify-content: center;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 6px;
    }

    .brand-header .brand-mark {
      margin-bottom: 12px;
    }

    .brand-header h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .brand-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .auth-card {
      background: rgba(11, 21, 32, 0.9);
      border: 1px solid rgba(133, 176, 212, 0.14);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.2);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 6px;
    }

    .segmented button {
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--muted);
      padding: 0.72rem 0.8rem;
      border-radius: 12px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .segmented button.active {
      background: linear-gradient(180deg, rgba(56, 211, 159, 0.16), rgba(19, 182, 122, 0.14));
      color: var(--text);
      border: 1px solid rgba(56, 211, 159, 0.44);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    .field label {
      font-size: 0.78rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .field input {
      width: 100%;
      border: 1px solid rgba(150, 177, 200, 0.18);
      border-radius: 14px;
      background: rgba(16, 25, 35, 0.88);
      color: var(--text);
      padding: 0.9rem 0.95rem;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .field input:focus {
      border-color: rgba(108, 168, 255, 0.72);
      box-shadow: 0 0 0 3px rgba(108, 168, 255, 0.15);
    }

    .primary {
      width: 100%;
      border: 0;
      background: linear-gradient(180deg, rgba(56, 211, 159, 0.88), rgba(19, 182, 122, 0.94));
      color: #0a1e17;
      padding: 1rem 1.2rem;
      font-size: 0.96rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.3rem;
      box-shadow: 0 16px 28px rgba(19, 182, 122, 0.18);
    }

    .secondary {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: none;
      color: var(--text);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-note {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      margin-top: 0.8rem;
      min-height: 1.2em;
    }

    .auth-note.error {
      color: #ff9a9a;
    }

    .auth-note.success {
      color: #93f1d0;
    }

    .app-screen {
      padding: 14px 14px 20px;
      min-height: min(100vh - 32px, 860px);
      min-height: min(100dvh - 32px, 860px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 6px 2px 10px;
      border-bottom: 1px solid rgba(158, 184, 207, 0.14);
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--green);
    }

    .mini-mark {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(56,211,159,0.8), rgba(19,182,122,0.9));
      position: relative;
    }

    .mini-mark::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.92);
      border-top-color: transparent;
      border-left-color: transparent;
      transform: rotate(34deg);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(146, 191, 255, 0.08);
      border: 1px solid rgba(146, 191, 255, 0.16);
      border-radius: 999px;
      padding: 0.45rem 0.7rem;
      color: var(--text);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(56, 211, 159, 0.0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.0); }
    }

    .status-led.red {
      background: var(--red);
      animation-duration: 1.3s;
    }

    .status-led.amber {
      background: var(--amber);
      animation-duration: 1.9s;
    }

    .profile-panel,
    .panel {
      background: rgba(12, 20, 31, 0.9);
      border-radius: 22px;
      border: 1px solid rgba(125, 170, 212, 0.14);
      box-shadow: 0 16px 36px rgba(0,0,0,0.18);
    }

    .profile-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px 12px;
    }

    .avatar-ring {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(56,211,159,0.2), rgba(108,168,255,0.3));
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }

    .profile-meta {
      flex: 1;
      min-width: 0;
    }

    .profile-meta h2 {
      margin: 0;
      font-size: 1.15rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subline {
      color: var(--muted);
      margin-top: 5px;
      font-size: 0.8rem;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .panel {
      padding: 14px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-header h3 {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .channel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 230px;
      overflow: auto;
      padding-right: 2px;
    }

    .channel-option {
      width: 100%;
      text-align: left;
      border-radius: 16px;
      padding: 0.8rem 0.9rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: none;
    }

    .channel-option.active {
      background: linear-gradient(180deg, rgba(56,211,159,0.1), rgba(108,168,255,0.08));
      border-color: rgba(56,211,159,0.4);
    }

    .channel-name-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .channel-name {
      font-weight: 700;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-desc {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .channel-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .channel-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(56,211,159,0.08);
    }

    .speed-badge {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 0.36rem 0.6rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .talk-panel {
      padding-top: 18px;
      padding-bottom: 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .speaker-box {
      padding: 18px 12px;
      border-radius: 18px;
      text-align: center;
      background: linear-gradient(180deg, rgba(12, 24, 36, 0.7), rgba(7, 14, 22, 0.8));
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 94px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .speaker-box .caption {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .speaker-name {
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ptt-btn {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto 12px;
      border: 8px solid rgba(255,255,255,0.08);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.86), rgba(255,255,255,0.08) 28%, rgba(9, 17, 24, 0.75) 29%, rgba(8, 20, 25, 0.9) 100%);
      box-shadow: 0 18px 36px rgba(0,0,0,0.28), inset 0 0 0 2px rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.25s ease;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text);
    }

    .ptt-btn::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .ptt-btn span {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 72%;
      line-height: 1.2;
    }

    .ptt-btn.ready {
      background: radial-gradient(circle at 30% 30%, rgba(56, 211, 159, 0.28), rgba(56,211,159,0.12) 26%, rgba(7, 31, 26, 0.8) 28%, rgba(8, 15, 19, 0.96) 100%);
      box-shadow: 0 18px 36px rgba(19, 182, 122, 0.18), 0 0 20px rgba(56,211,159,0.2), inset 0 0 0 2px rgba(56,211,159,0.14);
    }

    .ptt-btn.transmitting {
      background: radial-gradient(circle at 30% 30%, rgba(255, 93, 93, 0.35), rgba(255,93,93,0.14) 26%, rgba(36, 9, 15, 0.85) 28%, rgba(20, 7, 10, 0.96) 100%);
      box-shadow: 0 18px 40px rgba(255, 93, 93, 0.2), 0 0 30px rgba(255,93,93,0.2), inset 0 0 0 2px rgba(255,93,93,0.18);
      animation: buzz 0.9s infinite alternate;
    }

    @keyframes buzz {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    .ptt-btn.receiving {
      background: radial-gradient(circle at 30% 30%, rgba(108,168,255,0.24), rgba(108,168,255,0.1) 26%, rgba(8, 17, 25, 0.9) 28%, rgba(4, 12, 18, 0.96) 100%);
      box-shadow: 0 18px 36px rgba(108,168,255,0.18), 0 0 24px rgba(108,168,255,0.18);
    }

    .ptt-btn:disabled {
      opacity: 0.45;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .meta-box {
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      padding: 10px 12px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .meta-box .label {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .meta-box .value {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
    }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0.7rem 0.7rem;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .member-row .left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .member-avatar {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      background: linear-gradient(180deg, rgba(96, 125, 255, 0.2), rgba(56, 211, 159, 0.2));
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .member-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-tag {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .panel-footer {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ghost {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: none;
      color: var(--text);
      font-size: 0.78rem;
      padding: 0.72rem 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 16, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 6;
    }

    .settings-card {
      width: min(100%, 380px);
      background: rgba(12,20,31,0.98);
      border: 1px solid rgba(146, 191, 255, 0.12);
      border-radius: 24px;
      padding: 18px 16px 16px;
      box-shadow: 0 26px 48px rgba(0,0,0,0.28);
    }

    .settings-card h3 {
      margin: 0 0 14px;
      font-size: 1.08rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
    }

    .toggle {
      position: relative;
      display: inline-flex;
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    .toggle input {
      display: none;
    }

    .toggle .switch {
      position: absolute;
      inset: 3px auto 3px 3px;
      width: 18px;
      border-radius: 50%;
      background: white;
      transition: transform 0.2s ease;
    }

    .toggle input:checked ~ .switch {
      transform: translateX(18px);
      background: var(--green);
    }

    .toggle input:checked ~ .toggle-bg {

    .toggle-bg {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.04);

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + var(--safe-bottom));
      transform: translateX(-50%) translateY(14px);
      opacity: 0;
      pointer-events: none;
      background: rgba(14, 22, 31, 0.96);
      color: var(--text);

    @media (max-width: 370px) {
      .screen, .app-screen { padding-left: 10px; padding-right: 10px; }

    }
  </style>
</head>
<body>

  <div id="toast" class="toast" aria-live="polite"></div>
  <audio id="remote-audio" autoplay playsinline></audio>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import {
      getDatabase,
      ref,
      set,
      get,
      onValue,
      update,
      remove,
      push,
      serverTimestamp,
      runTransaction,
      onDisconnect
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAVoP7bX_Baejw7mIg9R07H7AFUYPeEW0A',
      authDomain: 'patchisi-online-game.firebaseapp.com',
      databaseURL: 'https://patchisi-online-game-default-rtdb.firebaseio.com',
      projectId: 'patchisi-online-game',
      storageBucket: 'patchisi-online-game.firebasestorage.app',
      messagingSenderId: '505649893262',
      appId: '1:505649893262:web:616a91f0359b7ddd099edf',
      measurementId: 'G-V4CEPP768E'
    };

    function validateFirebaseConfig(config) {
      const required = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'appId'];
      const missing = required.filter((key) => !config[key] || String(config[key]).trim() === '');
      if (missing.length) {
        throw new Error(`Firebase config is incomplete. Missing: ${missing.join(', ')}. Open Firebase Console > Project settings > Your apps and confirm the active web app matches the project you are using.`);
      }
      const authDomain = String(config.authDomain || '').toLowerCase();
      const projectId = String(config.projectId || '').toLowerCase();
      const databaseUrl = String(config.databaseURL || '').toLowerCase();
      if (projectId && !authDomain.includes(projectId) && !authDomain.includes('firebaseapp.com') && !authDomain.includes('web.app')) {
        console.warn('Firebase authDomain does not match projectId. This commonly triggers "Firebase: Error (auth/configuration-not-found)".');
      }
      if (projectId && !databaseUrl.includes(projectId)) {
        console.warn('Firebase databaseURL does not match the active project. This usually means the app is configured to a different Firebase project.');
      }
    }

    validateFirebaseConfig(firebaseConfig);

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const DEFAULT_CHANNELS = [
      { id: 'general', name: 'General', description: 'All stations' },
      { id: 'team-alpha', name: 'Team Alpha', description: 'Field operations' },
      { id: 'team-bravo', name: 'Team Bravo', description: 'Support channel' },
      { id: 'training-room', name: 'Training Room', description: 'Practice channel' }
    ];

    const ui = {
      loading: document.getElementById('loading-screen'),
      loadingBar: document.getElementById('loading-bar'),
      authScreen: document.getElementById('auth-screen'),
      appScreen: document.getElementById('app-screen'),
      registerForm: document.getElementById('register-form'),
      loginForm: document.getElementById('login-form'),
      showRegister: document.getElementById('show-register'),
      showLogin: document.getElementById('show-login'),
      authNote: document.getElementById('auth-note'),
      profileName: document.getElementById('profile-name'),
      profileAvatar: document.getElementById('profile-avatar'),
      presenceStatus: document.getElementById('presence-status'),
      currentChannelTag: document.getElementById('current-channel-tag'),
      channelList: document.getElementById('channel-list'),
      channelCount: document.getElementById('channel-count'),
      memberList: document.getElementById('member-list'),
      memberCount: document.getElementById('member-count'),
      speakerName: document.getElementById('speaker-name'),
      pushToTalk: document.getElementById('push-to-talk'),
      networkStatus: document.getElementById('network-status'),
      channelNameBox: document.getElementById('channel-name-box'),
      loginBox: document.getElementById('login-box'),
      toast: document.getElementById('toast'),
      settingsOverlay: document.getElementById('settings-overlay'),
      settingsButton: document.getElementById('settings-button'),
      closeSettings: document.getElementById('close-settings'),
      leaveChannelButton: document.getElementById('leave-channel-button'),
      logoutButton: document.getElementById('logout-button'),
      micStatusLabel: document.getElementById('mic-status-label'),
      connectionStatusLabel: document.getElementById('connection-status-label'),
      networkLabel: document.getElementById('network-label'),
      soundToggle: document.getElementById('sound-toggle'),
      remoteAudio: document.getElementById('remote-audio')
    };

    const state = {
      user: null,
      profile: null,
      channelKey: 'general',
      channelMap: {},
      channelMembers: {},
      usersByUid: {},
      activePeers: {},
      micStream: null,
      isTransmitting: false,
      isConnected: false,
      soundEnabled: true,
      currentSpeakerName: 'Waiting',
      currentSessionId: null,
      channelSubscriptions: [],
      userPresenceUnsubscribe: null
    };

    function showToast(message, tone = 'info') {
      ui.toast.textContent = message;
      ui.toast.className = `toast ${tone} visible`;
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        ui.toast.classList.remove('visible');
      }, 2200);
    }

    function setAuthNote(text, type = '') {
      ui.authNote.textContent = text || '';
      ui.authNote.className = `auth-note ${type}`.trim();
    }

    function setScreen(name) {
      ui.authScreen.classList.toggle('hidden', name !== 'auth');
      ui.appScreen.classList.toggle('hidden', name !== 'app');
      ui.loading.classList.add('hidden');
    }

    function updateLoadingProgress(value) {
      ui.loadingBar.style.width = `${Math.min(100, Math.max(0, value))}%`;
    }

    function startLoadingSequence() {
      let value = 12;
      updateLoadingProgress(value);
      const timer = setInterval(() => {
        value = Math.min(value + Math.random() * 18, 94);
        updateLoadingProgress(value);
      }, 150);
      window.__radioTalkLoader = timer;
    }

    function normalizeUsername(value) {
      return String(value || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'radio-user';
    }

    function generatePrivateAuthEmail(username) {
      const base = normalizeUsername(username).replace(/[^a-z0-9]/g, '').slice(0, 18) || 'radio-user';
      const randomPart = (() => {
        if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
          const values = new Uint32Array(3);
          window.crypto.getRandomValues(values);
          return Array.from(values).map((value) => value.toString(16).padStart(8, '0')).join('').slice(0, 20);
        }
        return `${Date.now()}${Math.random().toString(16).slice(2, 10)}`;
      })();
      return `${base}-${randomPart}@radiotalk.internal`;
    }

    function getInitials(name) {
      const safe = (name || '').trim();
      if (!safe) return 'R';
      return safe.slice(0, 2).toUpperCase();
    }

    function getChannelName(channelKey) {
      const meta = state.channelMap[channelKey] || DEFAULT_CHANNELS.find((item) => item.id === channelKey);
      if (!meta) return channelKey;
      return meta.name || channelKey;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderChannels() {
      const channels = Object.entries(state.channelMap || {}).sort((a, b) => a[0].localeCompare(b[0]));

      if (!channels.length) {
        ui.channelList.innerHTML = '<div class="channel-desc">No channels available.</div>';
        ui.channelCount.textContent = '0';
        return;
      }

      ui.channelCount.textContent = String(channels.length);
      ui.channelList.innerHTML = '';

      channels.forEach(([channelId, meta]) => {
        const count = meta && meta.members ? Object.keys(meta.members).length : 0;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `channel-option ${state.channelKey === channelId ? 'active' : ''}`;
        button.innerHTML = `
          <div class="channel-name-wrap">
            <span class="channel-name">${escapeHtml(meta.name || channelId)}</span>
            <span class="channel-desc">${escapeHtml(meta.description || 'Live channel')}</span>
          </div>
          <div class="channel-meta">
            <span class="channel-dot"></span>
            <span>${count}</span>
          </div>
        `;
        button.addEventListener('click', () => {
          if (channelId !== state.channelKey) {
            joinChannel(channelId);
          }
        });
        ui.channelList.appendChild(button);
      });
    }

    function renderMembers() {
      const members = Object.values(state.channelMembers || {});
      ui.memberCount.textContent = `${members.length} members`;
      ui.memberList.innerHTML = '';

      if (!members.length) {
        const empty = document.createElement('div');
        empty.className = 'member-tag';
        empty.textContent = 'No members connected';
        ui.memberList.appendChild(empty);
        return;
      }

      members.forEach((member) => {
        const row = document.createElement('div');
        row.className = 'member-row';
        const name = member.username || state.usersByUid[member.uid]?.username || 'Anonymous';
        row.innerHTML = `
          <div class="left">
            <div class="member-avatar">${getInitials(name)}</div>
            <div>
              <div class="member-name">${escapeHtml(name)}${member.uid === state.user?.uid ? ' (You)' : ''}</div>
              <div class="member-tag">${member.uid === state.user?.uid ? 'Host' : 'Listening'}</div>
            </div>
          </div>
          <span class="status-led ${member.status === 'online' ? '' : 'red'}" style="width:8px;height:8px;border-radius:50%;display:inline-block;"></span>
        `;
        ui.memberList.appendChild(row);
      });
    }

    function updateStatusDisplay() {
      const userName = state.profile?.username || state.user?.displayName || 'Radio operator';
      ui.profileAvatar.textContent = getInitials(userName);
      ui.profileName.textContent = userName;
      ui.currentChannelTag.textContent = getChannelName(state.channelKey);
      ui.channelNameBox.textContent = getChannelName(state.channelKey);
      ui.loginBox.textContent = state.user ? 'Connected' : 'Offline';
      ui.presenceStatus.innerHTML = `<span class="status-led ${state.isConnected ? '' : 'red'}"></span> ${state.isConnected ? 'Online' : 'Offline'}`;
      ui.speakerName.textContent = state.currentSpeakerName || 'Waiting';
      ui.micStatusLabel.textContent = state.micStream ? 'Active' : 'Ready';
      ui.micStatusLabel.style.color = state.micStream ? 'var(--green)' : 'var(--amber)';

      if (state.isTransmitting) {
        ui.pushToTalk.classList.remove('ready', 'receiving');
        ui.pushToTalk.classList.add('transmitting');
        ui.pushToTalk.innerHTML = '<span>Transmitting</span>';
      } else if (state.currentSpeakerName && state.currentSpeakerName !== 'Waiting' && state.currentSpeakerName !== 'Channel busy' && state.currentSpeakerName !== userName) {
        ui.pushToTalk.classList.remove('ready', 'transmitting');
        ui.pushToTalk.classList.add('receiving');
        ui.pushToTalk.innerHTML = '<span>Receiving</span>';
      } else {
        ui.pushToTalk.classList.remove('transmitting', 'receiving');
        ui.pushToTalk.classList.add('ready');
        ui.pushToTalk.innerHTML = '<span>Ready to transmit</span>';
      }

      ui.pushToTalk.disabled = !(state.user && state.isConnected);
    }

    function setNetworkStatus() {
      const online = navigator.onLine;
      ui.networkLabel.textContent = state.isConnected ? (online ? 'Stable' : 'Limited') : 'Offline';
      ui.networkLabel.style.color = state.isConnected && online ? 'var(--green)' : 'var(--amber)';
      ui.connectionStatusLabel.textContent = state.isConnected ? 'Online' : 'Offline';
      ui.connectionStatusLabel.style.color = state.isConnected ? 'var(--green)' : 'var(--amber)';
      ui.networkStatus.innerHTML = `<span class="status-led ${state.isConnected ? '' : 'amber'}"></span> ${state.isConnected ? 'Online' : 'Reconnecting'}`;
    }

    function generateId(prefix = 'rt') {
      if (window.crypto && crypto.randomUUID) {
        return `${prefix}-${crypto.randomUUID()}`;
      }
      return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function ensureDefaultChannels() {
      const defaultRef = ref(db, 'channels');
      return get(defaultRef).then((snapshot) => {
        if (!snapshot.exists()) {
          const updates = {};
          DEFAULT_CHANNELS.forEach((channel) => {
            updates[channel.id] = {
              name: channel.name,
              description: channel.description,
              members: {},
              speakingLock: { holderUid: null, sessionId: null, expiresAt: 0, acquiredAt: 0 },
              signalQueue: {},
              createdAt: serverTimestamp()
            };
          });
          return set(defaultRef, updates);
        }

        const existing = snapshot.val() || {};
        const toCreate = {};
        DEFAULT_CHANNELS.forEach((channel) => {
          if (!existing[channel.id]) {
            toCreate[channel.id] = {
              name: channel.name,
              description: channel.description,
              members: {},
              speakingLock: { holderUid: null, sessionId: null, expiresAt: 0, acquiredAt: 0 },
              signalQueue: {},
              createdAt: serverTimestamp()
            };
          }
        });
        if (Object.keys(toCreate).length) {
          return update(defaultRef, toCreate);
        }
        return null;
      });
    }

    async function reserveUsername(uid, username) {
      const normalized = normalizeUsername(username);
      const usernameRef = ref(db, `usernames/${normalized}`);
      try {
        await runTransaction(usernameRef, (current) => {
          if (current && current !== uid) {
            throw new Error('USERNAME_TAKEN');
          }
          return uid;
        });
      } catch (error) {
        if (String(error.message || error).includes('USERNAME_TAKEN')) {
          throw new Error('This username is already in use.');
        }
        throw error;
      }
    }

    async function createAccount(username, password) {
      const trimmed = String(username || '').trim();
      if (!trimmed || trimmed.length < 2) throw new Error('Username must be at least 2 characters long.');
      if (!/^[a-zA-Z0-9 _-]+$/.test(trimmed)) throw new Error('Username can contain letters, numbers, spaces, underscores, and dashes only.');
      if (!password || password.length < 6) throw new Error('Please provide a password with at least 6 characters.');
      const authEmail = generatePrivateAuthEmail(trimmed);
      const authUser = await createUserWithEmailAndPassword(auth, authEmail, password);
      await updateProfile(authUser.user, { displayName: trimmed });
      await reserveUsername(authUser.user.uid, trimmed);
      const userRef = ref(db, `users/${authUser.user.uid}`);
      await set(userRef, {
        uid: authUser.user.uid,
        username: trimmed,
        authEmail,
        status: 'online',
        currentChannel: 'general',
        createdAt: serverTimestamp(),
        lastSeen: serverTimestamp()
      });
      return authUser;
    }

    async function login(username, password) {
      const trimmed = String(username || '').trim();
      if (!trimmed || !password) throw new Error('Please enter both username and password.');
      const usernameKey = normalizeUsername(trimmed);
      const usernameRef = ref(db, `usernames/${usernameKey}`);
      const uidSnapshot = await get(usernameRef);
      const uid = uidSnapshot.val();
      if (!uid) {
        throw new Error('No account was found for that username.');
      }
      const userRef = ref(db, `users/${uid}`);
      const userSnapshot = await get(userRef);
      const profile = userSnapshot.val() || {};
      const authEmail = profile.authEmail || profile.email || generatePrivateAuthEmail(trimmed);
      return signInWithEmailAndPassword(auth, authEmail, password);
    }

    function mapAuthError(error) {
      const code = error && error.code ? error.code : '';
      const message = error && error.message ? error.message : 'Authentication failed.';
      if (code === 'auth/email-already-in-use') return 'An account with this generated identity already exists.';
      if (code === 'auth/invalid-email') return 'The internal identity is not valid. Please try again.';
      if (code === 'auth/weak-password') return 'Password is too weak. Use at least 6 characters.';
      if (code === 'auth/user-not-found' || code === 'auth/wrong-password') return 'Invalid username or password.';
      if (code === 'auth/user-disabled') return 'This account has been disabled.';
      if (code === 'auth/network-request-failed') return 'Network error. Please retry.';
      if (String(message).includes('USERNAME_TAKEN')) return 'This username is already in use.';
      if (String(message).includes('No account was found for that username')) return 'No account was found for that username.';
      if (message && message !== 'Authentication failed.') return message;
      return 'Unable to complete that request.';
    }

    function subscribeToPresence(uid) {
      if (state.userPresenceUnsubscribe) {
        state.userPresenceUnsubscribe();
      }
      const connectedRef = ref(db, '.info/connected');
      const userPresenceRef = ref(db, `presence/${uid}`);
      const userRef = ref(db, `users/${uid}`);
      state.userPresenceUnsubscribe = onValue(connectedRef, async (snapshot) => {
        const isOnline = !!snapshot.val();
        state.isConnected = isOnline;
        setNetworkStatus();
        if (isOnline) {
          await set(userPresenceRef, {
            uid,
            username: state.profile?.username || state.user?.displayName || 'Radio operator',
            status: 'online',
            currentChannel: state.channelKey,
            lastSeen: serverTimestamp()
          });
          await update(userRef, {
            status: 'online',
            lastSeen: serverTimestamp(),
            currentChannel: state.channelKey
          });
          onDisconnect(userPresenceRef).remove();
          onDisconnect(userRef).update({ status: 'offline', lastSeen: serverTimestamp() });
        } else {
          await update(userRef, { status: 'offline', lastSeen: serverTimestamp() });
          if (state.user && state.user.uid === uid) {
            showToast('Connection lost. Reconnecting...', 'info');
          }
        }
        updateStatusDisplay();
      });
    }

    function cleanupPeerConnections() {
      Object.values(state.activePeers).forEach((pc) => {
        if (pc && typeof pc.close === 'function') {
          pc.close();
        }
      });
      state.activePeers = {};
    }

    async function releaseSpeakingLock() {
      if (!state.user || !state.channelKey) return;
      const lockRef = ref(db, `channels/${state.channelKey}/speakingLock`);
      const snapshot = await get(lockRef);
      const lock = snapshot.val() || {};
      if (lock.holderUid === state.user.uid && lock.sessionId === state.currentSessionId) {
        await remove(lockRef);
      }
      state.currentSessionId = null;
      state.isTransmitting = false;
      updateStatusDisplay();
    }

    async function stopLocalMicrophone() {
      if (state.micStream) {
        state.micStream.getTracks().forEach((track) => track.stop());
        state.micStream = null;
      }
      ui.micStatusLabel.textContent = 'Ready';
      ui.micStatusLabel.style.color = 'var(--amber)';
    }

    async function stopTransmission() {
      await stopLocalMicrophone();
      await releaseSpeakingLock();
      cleanupPeerConnections();
      state.currentSpeakerName = 'Waiting';
      updateStatusDisplay();
    }

    async function ensureOtherMembersPeer(remoteUid) {
      if (!state.user || !state.channelKey) return null;
      if (state.activePeers[remoteUid]) {
        return state.activePeers[remoteUid];
      }
      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      });

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal(remoteUid, 'candidate', event.candidate.toJSON());
        }
      };

      pc.ontrack = (event) => {
        const [stream] = event.streams;
        if (stream) {
          ui.remoteAudio.srcObject = stream;
          ui.remoteAudio.play().catch(() => {});
          const label = state.usersByUid[remoteUid]?.username || 'Remote user';
          state.currentSpeakerName = label;
          updateStatusDisplay();
        }
      };

      pc.onconnectionstatechange = () => {
        const status = pc.connectionState;
        if (status === 'failed' || status === 'closed') {
          state.currentSpeakerName = 'Waiting';
          updateStatusDisplay();
        }
      };

      if (state.micStream) {
        state.micStream.getTracks().forEach((track) => pc.addTrack(track, state.micStream));
      }
      state.activePeers[remoteUid] = pc;
      return pc;
    }

    async function sendSignal(targetUid, type, payload) {
      if (!state.user || !state.channelKey) return;
      const queueRef = ref(db, `channels/${state.channelKey}/signalQueue`);
      const messageRef = push(queueRef);
      const message = {
        id: messageRef.key,
        to: targetUid,
        senderUid: state.user.uid,
        type,
        payload,
        createdAt: Date.now()
      };
      await set(messageRef, message);
      setTimeout(() => {
        remove(messageRef).catch(() => {});
      }, 40000);
    }

    async function processSignalQueue(messages) {
      if (!messages) return;
      const entries = Object.entries(messages);
      if (!entries.length) return;
      for (const [key, message] of entries) {
        if (!message || message.to !== state.user?.uid || message.senderUid === state.user?.uid) {
          continue;
        }

        try {
          if (message.type === 'offer' || message.type === 'answer') {
            const peer = await ensureOtherMembersPeer(message.senderUid);
            const description = new RTCSessionDescription(message.payload);
            await peer.setRemoteDescription(description);
            if (message.type === 'offer') {
              const answer = await peer.createAnswer();
              await peer.setLocalDescription(answer);
              await sendSignal(message.senderUid, 'answer', answer);
            }
          }

          if (message.type === 'candidate') {
            const peer = state.activePeers[message.senderUid];
            if (peer && peer.remoteDescription) {
              await peer.addIceCandidate(new RTCIceCandidate(message.payload));
            }
          }
        } catch (error) {
          console.warn('Signal handling error:', error);
        } finally {
          const signalRef = ref(db, `channels/${state.channelKey}/signalQueue/${key}`);
          remove(signalRef).catch(() => {});
        }
      }
    }

    function attachChannelListeners(channelKey) {
      state.channelSubscriptions.forEach((unsubscribe) => unsubscribe && unsubscribe());
      state.channelSubscriptions = [];

      const signalRef = ref(db, `channels/${channelKey}/signalQueue`);
      const membersRef = ref(db, `channels/${channelKey}/members`);
      const lockRef = ref(db, `channels/${channelKey}/speakingLock`);

      state.channelSubscriptions.push(
        onValue(signalRef, (snapshot) => processSignalQueue(snapshot.val() || {})),
        onValue(membersRef, (snapshot) => {
          const members = snapshot.val() || {};
          state.channelMembers = members;
          renderMembers();
          Object.entries(members).forEach(([uid, member]) => {
            state.usersByUid[uid] = { uid, username: member.username || 'Remote user' };
          });
        }),
        onValue(lockRef, (snapshot) => {
          const lock = snapshot.val() || {};
          const holderUid = lock.holderUid;
          if (holderUid && holderUid !== state.user?.uid) {
            const holderName = state.usersByUid[holderUid]?.username || 'Remote speaker';
            state.currentSpeakerName = holderName;
          } else if (holderUid === state.user?.uid) {
            state.currentSpeakerName = state.profile?.username || 'You';
          } else {
            state.currentSpeakerName = 'Waiting';
          }
          updateStatusDisplay();
        })
      );
    }

    async function joinChannel(channelKey) {
      if (!state.user) return;
      const targetChannel = channelKey || state.channelKey || 'general';
      const channelRef = ref(db, `channels/${targetChannel}`);
      const channelSnapshot = await get(channelRef);
      if (!channelSnapshot.exists()) {
        showToast('Channel not found.', 'error');
        return;
      }

      const userRef = ref(db, `users/${state.user.uid}`);
      const memberRef = ref(db, `channels/${targetChannel}/members/${state.user.uid}`);
      const username = state.profile?.username || state.user.displayName || 'Radio operator';

      await set(memberRef, {
        uid: state.user.uid,
        username,
        status: 'online',
        joinedAt: serverTimestamp()
      });

      await update(userRef, {
        currentChannel: targetChannel,
        lastSeen: serverTimestamp()
      });

      state.channelKey = targetChannel;
      state.currentSpeakerName = 'Waiting';
      attachChannelListeners(targetChannel);
      renderChannels();
      updateStatusDisplay();
      showToast(`Joined ${getChannelName(targetChannel)}`, 'success');
    }

    async function leaveChannel() {
      if (!state.user || !state.channelKey) return;
      const channelKey = state.channelKey;
      const memberRef = ref(db, `channels/${channelKey}/members/${state.user.uid}`);
      await remove(memberRef);
      await update(ref(db, `users/${state.user.uid}`), { currentChannel: 'general', lastSeen: serverTimestamp() });
      state.channelKey = 'general';
      cleanupPeerConnections();
      await stopTransmission();
      attachChannelListeners('general');
      renderChannels();
      updateStatusDisplay();
      showToast('Left channel', 'info');
    }

    function setAuthMode(mode) {
      const registerVisible = mode === 'register';
      ui.showRegister.classList.toggle('active', registerVisible);
      ui.showLogin.classList.toggle('active', !registerVisible);
      ui.showRegister.setAttribute('aria-selected', String(registerVisible));
      ui.showLogin.setAttribute('aria-selected', String(!registerVisible));
      ui.registerForm.classList.toggle('hidden', !registerVisible);
      ui.loginForm.classList.toggle('hidden', registerVisible);
      setAuthNote('');
    }

    async function requestSpeakingLock() {
      if (!state.user || !state.channelKey) {
        showToast('Join a channel first', 'info');
        return;
      }

      const lockRef = ref(db, `channels/${state.channelKey}/speakingLock`);
      const sessionId = generateId('lock');
      state.currentSessionId = sessionId;
      const nowMs = Date.now();

      try {
        const result = await runTransaction(lockRef, (current) => {
          const lock = current || {};
          const expiresAt = Number(lock.expiresAt || 0);
          if (lock.holderUid && lock.holderUid !== state.user.uid && expiresAt > nowMs) {
            return undefined;
          }
          return {
            holderUid: state.user.uid,
            sessionId,
            expiresAt: nowMs + 18000,
            acquiredAt: nowMs
          };
        });

        if (!result.committed) {
          state.currentSessionId = null;
          state.currentSpeakerName = 'Channel busy';
          updateStatusDisplay();
          showToast('CHANNEL BUSY', 'error');
          return;
        }

        const channelSnapshot = await get(ref(db, `channels/${state.channelKey}`));
        const members = channelSnapshot.val()?.members || {};
        const memberIds = Object.keys(members).filter((uid) => uid !== state.user.uid);
        if (!memberIds.length) {
          showToast('No other members in this channel.', 'info');
          await releaseSpeakingLock();
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Microphone access is not available on this device.', 'error');
          await releaseSpeakingLock();
          return;
        }

        try {
          state.micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1
            },
            video: false
          });

          ui.micStatusLabel.textContent = 'Active';
          ui.micStatusLabel.style.color = 'var(--green)';

          for (const remoteUid of memberIds) {
            const peer = await ensureOtherMembersPeer(remoteUid);
            const offer = await peer.createOffer({ offerToReceiveAudio: true });
            await peer.setLocalDescription(offer);
            await sendSignal(remoteUid, 'offer', offer);
          }

          state.currentSpeakerName = state.profile?.username || state.user.displayName || 'You';
          state.isTransmitting = true;
          updateStatusDisplay();
        } catch (error) {
          console.error('Microphone error:', error);
          showToast('Microphone access was denied. Please allow access to use push-to-talk.', 'error');
          await releaseSpeakingLock();
        }
      } catch (error) {
        console.error('Lock request failed', error);
        state.currentSessionId = null;
        showToast('Unable to acquire a speaking lock.', 'error');
      }
    }

    function registerUiBindings() {
      ui.showRegister.addEventListener('click', () => setAuthMode('register'));
      ui.showLogin.addEventListener('click', () => setAuthMode('login'));

      ui.registerForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('reg-username').value;
        const password = document.getElementById('reg-password').value;

        if (!username || !password) {
          setAuthNote('Please provide both username and password.', 'error');
          return;
        }

        try {
          setAuthNote('Creating account...', '');
          await createAccount(username, password);
          setAuthNote('Account created successfully. Logging in...', 'success');
          await login(username, password);
        } catch (error) {
          setAuthNote(mapAuthError(error), 'error');
          console.error('Registration error:', error);
        }
      });

      ui.loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        try {
          setAuthNote('Signing in...', '');
          await login(username, password);
        } catch (error) {
          setAuthNote(mapAuthError(error), 'error');
          console.error('Login error:', error);
          showToast('Login failed', 'error');
        }
      });

      ui.pushToTalk.addEventListener('pointerdown', async () => {
        if (!state.user || !state.isConnected) {
          showToast('Connection not ready.', 'error');
          return;
        }
        if (state.isTransmitting) {
          await stopTransmission();
          return;
        }
        await requestSpeakingLock();
      });

      ui.pushToTalk.addEventListener('pointerup', async () => {
        if (state.isTransmitting) {
          await stopTransmission();
        }
      });

      ui.pushToTalk.addEventListener('mouseleave', async () => {
        if (state.isTransmitting) {
          await stopTransmission();
        }
      });

      ui.logoutButton.addEventListener('click', async () => {
        if (!state.user) return;
        if (!window.confirm('Log out and close your radio session?')) return;
        try {
          await signOut(auth);
        } catch (error) {
          console.error('Logout error:', error);
        }
      });

      ui.leaveChannelButton.addEventListener('click', async () => {
        await leaveChannel();
      });

      ui.settingsButton.addEventListener('click', () => {
        ui.settingsOverlay.classList.remove('hidden');
      });

      ui.closeSettings.addEventListener('click', () => {
        ui.settingsOverlay.classList.add('hidden');
      });

      ui.soundToggle.addEventListener('change', () => {
        state.soundEnabled = ui.soundToggle.checked;
        showToast(state.soundEnabled ? 'Sound enabled' : 'Sound muted', 'info');
      });

      document.addEventListener('keydown', async (event) => {
        if (event.code === 'Space' && !event.repeat) {
          event.preventDefault();
          if (!state.isTransmitting) {
            await requestSpeakingLock();
          } else {
            await stopTransmission();
          }
        }
      });

      window.addEventListener('online', () => {
        showToast('Connection restored', 'success');
        setNetworkStatus();
      });

      window.addEventListener('offline', () => {
        showToast('Network offline', 'info');
        setNetworkStatus();
      });
    }

    function loadChannelMetadata() {
      const channelRef = ref(db, 'channels');
      onValue(channelRef, (snapshot) => {
        const channels = snapshot.val() || {};
        state.channelMap = channels;
        const channelKey = state.channelKey || 'general';
        if (!channels[channelKey]) {
          state.channelKey = 'general';
        }
        renderChannels();
        ui.currentChannelTag.textContent = getChannelName(state.channelKey);
        ui.channelNameBox.textContent = getChannelName(state.channelKey);
      });
    }

    async function initializeAuthentication() {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          setScreen('auth');
          state.user = null;
          state.profile = null;
          state.channelSubscriptions.forEach((unsubscribe) => unsubscribe && unsubscribe());
          state.channelSubscriptions = [];
          cleanupPeerConnections();
          await stopLocalMicrophone();
          setAuthNote('Please sign in to continue.', '');
          return;
        }

        state.user = user;
        setScreen('app');
        const userRef = ref(db, `users/${user.uid}`);
        const profileSnapshot = await get(userRef);
        if (!profileSnapshot.exists()) {
          await set(userRef, {
            uid: user.uid,
            username: user.displayName || 'Radio operator',
            authEmail: user.email || generatePrivateAuthEmail(user.displayName || 'radio-user'),
            status: 'online',
            currentChannel: 'general',
            createdAt: serverTimestamp(),
            lastSeen: serverTimestamp()
          });
        }
        state.profile = (await get(userRef)).val() || {};
        state.usersByUid[user.uid] = { uid: user.uid, username: state.profile.username || user.displayName || 'Radio operator' };
        state.channelKey = state.profile.currentChannel || 'general';
        await ensureDefaultChannels();
        loadChannelMetadata();
        attachChannelListeners(state.channelKey);
        await joinChannel(state.channelKey);
        subscribeToPresence(user.uid);
        updateStatusDisplay();
      });
    }

    function boot() {
      startLoadingSequence();
      setTimeout(() => {
        updateLoadingProgress(100);
        setTimeout(() => {
          ui.loading.classList.add('hidden');
          setAuthMode('register');
          setScreen('auth');
        }, 250);
      }, 900);
      registerUiBindings();
      initializeAuthentication();
      setNetworkStatus();
    }

    boot();
  </script>
</body>
</html>
