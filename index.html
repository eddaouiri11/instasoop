<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Instasoop | Ultra Animation</title>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">

<style>
:root {
    --insta-gradient: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
    --blue-action:#0095f6;
    --bg-blue-blur: linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:sans-serif;}

html,body{
margin:0;
height:100%;
overflow:hidden;
background:#fafafa;
display:flex;
justify-content:center;
}

/* LOGIN */
#login-screen{
position:fixed;inset:0;
background:var(--insta-gradient);
display:none;
justify-content:center;
align-items:center;
z-index:3000;
}

.login-card{
background:#fff;
padding:30px;
border-radius:20px;
width:90%;
max-width:320px;
text-align:center;
}

.insta-logo{
font-size:3rem;
font-family:'Grand Hotel';
margin-bottom:15px;
}

/* APP */
#chat-app{
display:none;
flex-direction:column;
height:100vh;
width:100%;
max-width:500px;
background:#fff;
}

header{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
border-bottom:1px solid #eee;
}

.header-logo{
font-family:'Grand Hotel';
font-size:2rem;
background:var(--insta-gradient);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* CHAT */
#chat-box{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
background:var(--bg-blue-blur);
overflow-x:hidden;
}

/* MSG */
.msg{
max-width:80%;
display:flex;
flex-direction:column;
animation:fade .3s ease forwards;
opacity:0;
}

@keyframes fade{
to{opacity:1;}
}

.sent{align-self:flex-end;}
.recv{align-self:flex-start;}

.bubble{
padding:10px 15px;
border-radius:18px;
}

.sent .bubble{
background:var(--insta-gradient);
color:#fff;
}

.recv .bubble{
background:#fff;
border:1px solid #ddd;
}

/* INPUT */
.input-area{
padding:10px;
border-top:1px solid #eee;
background:#fff;
}

.input-wrap{
display:flex;
border:1px solid #ddd;
border-radius:20px;
padding:5px 10px;
}

#msgInput{
flex:1;
border:none;
outline:none;
}

.send-btn{
color:var(--blue-action);
font-weight:bold;
cursor:pointer;
}

/* BAN */
#banned-screen{
position:fixed;inset:0;
background:#fff;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:5000;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
<div class="login-card">
<span class="insta-logo">Instasoop</span>
<input id="usernameInput" placeholder="اسم المستخدم" style="width:100%;padding:10px;margin-bottom:10px;">
<button onclick="startApp()" style="width:100%;padding:10px;background:#0095f6;color:#fff;border:none;">دخول</button>
</div>
</div>

<!-- BAN -->
<div id="banned-screen">
<h2>🚫 محظور</h2>
<div id="timer-display"></div>
</div>

<!-- APP -->
<div id="chat-app">
<header>
<div class="header-logo">Instasoop</div>
<div id="displayUser"></div>
</header>

<div id="chat-box"></div>

<div class="input-area">
<div class="input-wrap">
<input id="msgInput" placeholder="اكتب...">
<div class="send-btn" onclick="send()">إرسال</div>
</div>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"instasoop-230e0.firebaseapp.com",
databaseURL:"https://instasoop-230e0-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let currentUser="";
let lastTimestamp=0;

/* INIT */
function init(){
const saved=localStorage.getItem('instasoop_session');
if(saved) checkStatus(saved);
else document.getElementById('login-screen').style.display='flex';
}

function startApp(){
const n=document.getElementById('usernameInput').value.trim();
if(n.length>=2) checkStatus(n);
}

function checkStatus(name){
db.ref('banned_users/'+name).on('value',snap=>{
const b=snap.val();

if(b){
if(b.expiry && Date.now()>b.expiry){
db.ref('banned_users/'+name).remove();
}else{
document.getElementById('banned-screen').style.display='flex';
startTimer(b.expiry);
return;
}
}

if(!currentUser){
currentUser=name;
localStorage.setItem('instasoop_session',name);
document.getElementById('displayUser').innerText="@"+name;
document.getElementById('login-screen').style.display='none';
document.getElementById('chat-app').style.display='flex';
loadMsgs();
}
});
}

/* LOAD MSG بدون scroll */
function loadMsgs(){
db.ref('messages').limitToLast(50).on('value',snap=>{
const box=document.getElementById('chat-box');
box.innerHTML="";

let arr=[];
snap.forEach(m=>arr.push(m.val()));

arr.forEach(d=>{
const div=document.createElement('div');
div.className="msg "+(d.user===currentUser?'sent':'recv');
div.innerHTML=`<div class="bubble">${d.text}</div>`;
box.appendChild(div);
});

});
}

/* SEND */
function send(){
const i=document.getElementById('msgInput');
const t=i.value.trim();
if(!t) return;

db.ref('messages').push({
user:currentUser,
text:t,
ts:Date.now()
});

i.value="";
}

/* BAN TIMER بدون reload */
function startTimer(expiry){
if(!expiry){
document.getElementById('timer-display').innerText="∞";
return;
}

const itv=setInterval(()=>{
const diff=expiry-Date.now();

if(diff<=0){
clearInterval(itv);

/* بدل reload */
document.getElementById('banned-screen').style.display='none';
document.getElementById('login-screen').style.display='flex';

localStorage.removeItem('instasoop_session');
currentUser="";
}

const m=Math.floor(diff/60000);
const s=Math.floor((diff%60000)/1000);
document.getElementById('timer-display').innerText=m+":"+s;

},1000);
}

document.getElementById('msgInput').addEventListener('keypress',e=>{
if(e.key==='Enter') send();
});

init();
</script>

</body>
</html>
