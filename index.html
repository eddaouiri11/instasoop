<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Blue Luxury</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #3b82f6; /* Blue */
            --primary-dark: #1d4ed8;
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text-main);
            height: 100%;
            width: 100%;
            overflow: hidden; /* منع الـ scroll ديال الصفحة كاملة */
        }

        body {
            display: flex;
            justify-content: center;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1e3a8a, #020617);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            padding: 30px 20px;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-large { font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(0 0 15px var(--primary)); }

        input {
            width: 100%;
            background: #1e293b;
            border: 2px solid #334155;
            padding: 14px;
            border-radius: 18px;
            color: white;
            font-size: 1rem;
            margin: 15px 0;
            outline: none;
            text-align: center;
        }

        input:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        /* Main Chat Layout */
        #chat-app {
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }

        header {
            padding: 12px 20px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 10;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        /* Container for scrolling messages */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png'); /* Pattern خفيف */
            -webkit-overflow-scrolling: touch;
        }

        .message-row { 
            display: flex; 
            flex-direction: column; 
            max-width: 82%; 
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .received { align-self: flex-start; }
        .sent { align-self: flex-end; }

        .user-tag { font-size: 0.7rem; margin-bottom: 2px; color: var(--text-dim); padding-right: 5px; }
        .sent .user-tag { text-align: left; color: var(--primary); padding-left: 5px; }

        .bubble {
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .received .bubble { 
            background: var(--surface); 
            border: 1px solid rgba(255,255,255,0.05);
            border-top-right-radius: 4px;
            color: #f1f5f9; 
        }

        .sent .bubble { 
            background: var(--primary); 
            border-top-left-radius: 4px;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .time { font-size: 0.6rem; margin-top: 3px; opacity: 0.5; align-self: flex-end; }
        .sent .time { align-self: flex-start; color: #fff; }

        /* Input Area Fixes */
        .input-container {
            padding: 10px 15px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--surface);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(59, 130, 246, 0.2);
        }

        #msgInput { 
            flex: 1;
            margin: 0; 
            text-align: right; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 1rem;
            color: white;
        }

        .send-btn {
            background: var(--primary);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div class="logo-large">🥣</div>
            <h1 style="margin:0; font-size: 1.8rem; color: var(--primary);">Instasoop</h1>
            <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 5px;">Blue Edition - تجربة غنية</p>
            <input type="text" id="usernameInput" placeholder="اكتب اسمك..." maxlength="12">
            <button class="btn-primary" onclick="startApp()">ابدأ الآن</button>
        </div>
    </div>

    <div id="chat-app">
        <header>
            <div style="display:flex; align-items:center;">
                <span style="font-weight:900; color:var(--primary); font-size: 1.1rem;">INSTASOOP</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="displayUser" style="font-size: 0.85rem; font-weight:600;"></span>
                <span class="status-dot"></span>
            </div>
        </header>

        <div id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
            <button class="send-btn" onclick="send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";

        // Fix height for mobile browsers (Chrome/Safari bars)
        function fixHeight() {
            document.body.style.height = window.innerHeight + "px";
            window.scrollTo(0, 0);
        }
        window.addEventListener('resize', fixHeight);
        fixHeight();

        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                send();
                e.preventDefault(); // منع نزول السطر
            }
        });

        function startApp() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name.length < 2) return alert("دخل سمية حقيقية!");
            currentUser = name;
            document.getElementById('displayUser').innerText = currentUser;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            fixHeight();
            loadMessages();
        }

        function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text) {
                db.ref('messages').push({
                    user: currentUser,
                    text: text,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})
                });
                input.value = '';
                input.focus();
            }
        }

        function loadMessages() {
            const chatBox = document.getElementById('chat-box');
            db.ref('messages').limitToLast(40).on('value', (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    const isMe = data.user === currentUser;
                    const row = document.createElement('div');
                    row.className = `message-row ${isMe ? 'sent' : 'received'}`;
                    row.innerHTML = `
                        <span class="user-tag">${data.user}</span>
                        <div class="bubble">${data.text}</div>
                        <span class="time">${data.time || ''}</span>
                    `;
                    chatBox.appendChild(row);
                });
                // Force scroll to bottom
                chatBox.scrollTop = chatBox.scrollHeight;
                // Double check for mobile delay
                setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 150);
            });
        }
    </script>
</body>
</html>
