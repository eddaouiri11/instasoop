<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Luxy Pro Edition</title>
    
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --luxy-gold: linear-gradient(135deg, #d4af37 0%, #fcf6ba 45%, #aa771c 100%);
            --luxy-dark: #080808;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-gold: #d4af37;
            --msg-sent: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            --msg-recv: rgba(212, 175, 55, 0.05);
            --danger-glow: 0 0 15px rgba(255, 75, 43, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--luxy-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(107, 70, 193, 0.05) 0%, transparent 40%);
            color: #fff;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--luxy-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .splash-logo {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            background: var(--luxy-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite, pulse 2s ease-in-out infinite;
            background-size: 200% auto;
            letter-spacing: 8px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .loader-bar {
            width: 150px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .loader-progress {
            position: absolute;
            height: 100%;
            width: 50%;
            background: var(--luxy-gold);
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* Login UI */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--luxy-dark);
            display: none; /*Hidden by default to show splash*/
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 40px;
        }

        .luxy-title {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            background: var(--luxy-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 50px;
            letter-spacing: 4px;
            animation: shine 4s linear infinite;
            background-size: 200% auto;
        }

        .login-input-group {
            width: 100%;
            max-width: 340px;
            position: relative;
        }

        #usernameInput {
            width: 100%;
            padding: 22px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: all 0.4s ease;
        }

        #usernameInput:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }

        .luxy-btn {
            width: 100%;
            padding: 20px;
            background: var(--luxy-gold);
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            cursor: pointer;
        }

        /* App Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .luxy-navbar {
            height: 80px;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-profile { display: flex; align-items: center; gap: 15px; }
        .luxy-avatar {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            background: var(--luxy-gold);
            padding: 2px;
            object-fit: cover;
        }

        .status-badge {
            font-size: 10px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Messages */
        .msg { max-width: 75%; position: relative; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .sent { align-self: flex-end; }
        .recv { align-self: flex-start; }

        .msg-sender {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 6px;
            margin-right: 10px;
        }

        .luxy-bubble {
            padding: 15px 22px;
            border-radius: 24px;
            font-size: 15px;
            line-height: 1.6;
            backdrop-filter: blur(10px);
        }

        .sent .luxy-bubble {
            background: var(--msg-sent);
            border: 1px solid var(--glass-border);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .recv .luxy-bubble {
            background: var(--msg-recv);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom-left-radius: 4px;
            color: #f0f0f0;
        }

        /* Input Area */
        .luxy-footer {
            padding: 20px 25px calc(25px + env(safe-area-inset-bottom));
            background: linear-gradient(transparent, #000);
        }

        .luxy-input-container {
            display: flex;
            align-items: center;
            background: var(--glass);
            border-radius: 25px;
            padding: 6px 20px;
            border: 1px solid var(--glass-border);
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 0;
            font-size: 15px;
        }

        .luxy-send {
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            border: none;
            background: none;
            margin-right: 15px;
            display: none;
        }

        /* Admin/Banned View */
        #admin-panel, #banned-screen {
            position: fixed; inset: 0; background: #000; z-index: 10005;
            display: none; flex-direction: column; padding: 30px;
        }

        .admin-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 24px; margin-bottom: 15px;
        }

        .ban-timer {
            font-family: 'Cinzel', serif;
            font-size: 70px;
            background: var(--luxy-gold);
            -webkit-background-clip: text;
            color: transparent;
        }

        #toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: var(--luxy-gold); color: #000; padding: 12px 35px;
            border-radius: 40px; font-weight: 800; font-size: 13px; z-index: 99999;
            display: none; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo">LUXY</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <div id="toast"></div>

    <!-- Login -->
    <div id="login-screen">
        <div class="luxy-title">LUXY</div>
        <div class="login-input-group">
            <input type="text" id="usernameInput" placeholder="أدخل اسمك الفاخر" maxlength="15">
            <button class="luxy-btn" onclick="startApp()">دخول المجلس</button>
        </div>
    </div>

    <!-- Chat App -->
    <div id="chat-app">
        <nav class="luxy-navbar">
            <div class="nav-profile">
                <img id="headerAvatar" class="luxy-avatar" src="" alt="User">
                <div>
                    <h3 id="headerName" style="font-size: 16px;">---</h3>
                    <span class="status-badge">● متصل الآن</span>
                </div>
            </div>
            <div style="opacity: 0.5; font-size: 20px;">✧</div>
        </nav>

        <main id="chat-box"></main>

        <footer class="luxy-footer">
            <div class="luxy-input-container">
                <input type="text" id="msgInput" placeholder="اكتب رسالة فخمة..." autocomplete="off">
                <button id="sendBtn" class="luxy-send" onclick="send()">إرسال</button>
            </div>
        </footer>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h2 style="font-family:'Cinzel'; color:var(--accent-gold);">لوحة التحكم الملكية</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; color:#fff; font-size:24px;">✕</button>
        </div>
        <div style="flex:1; overflow-y:auto;" id="admin-list"></div>
        <button onclick="nuclearWipe()" style="background:#ff3b30; color:#fff; padding:20px; border-radius:20px; border:none; font-weight:800; margin-top:20px;">مسح كافة السجلات</button>
    </div>

    <!-- Banned UI -->
    <div id="banned-screen">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
            <div style="font-size: 100px; margin-bottom: 20px;">👑</div>
            <h1 style="font-family:'Cinzel'; margin-bottom:10px;">دخول مقيد</h1>
            <div class="ban-timer" id="timer-display">00:00</div>
            <p style="color:#666; max-width:250px;">لقد تم تعليق صلاحياتك في هذا المجلس الفاخر مؤقتاً.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = localStorage.getItem('luxy_user') || "";

        // Splash Timer logic
        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.transition = 'opacity 0.8s ease';
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    if (!currentUser) {
                        document.getElementById('login-screen').style.display = 'flex';
                    }
                }, 800);
            }, 2500); // Show splash for 2.5 seconds
        };

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 3000);
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val.length < 2) return showToast("الاسم يجب أن يكون أطول");
            currentUser = val;
            checkBan(val);
        }

        function checkBan(name) {
            db.ref('banned_users/' + name).on('value', (s) => {
                const b = s.val();
                if(b && b.expiry && Date.now() < b.expiry) {
                    showBannedView(b.expiry);
                } else {
                    if(document.getElementById('banned-screen').style.display === 'flex') location.reload();
                    launch(name);
                }
            });
        }

        function launch(name) {
            localStorage.setItem('luxy_user', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}&backgroundColor=000000`;
            document.getElementById('headerName').innerText = name;
            
            db.ref('active_users/' + name).set({ ts: Date.now() });

            db.ref('messages').limitToLast(100).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                const scroll = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = '';
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    const d = document.createElement('div');
                    d.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    d.innerHTML = `
                        ${!isMe ? `<div class="msg-sender">${m.user}</div>` : ''}
                        <div class="luxy-bubble">${m.text}</div>
                    `;
                    box.appendChild(d);
                });
                if(scroll) box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;
            if(txt === "20102010") return openAdmin();

            db.ref('messages').push({
                user: currentUser,
                text: txt,
                ts: Date.now()
            });
            input.value = "";
            document.getElementById('sendBtn').style.display = 'none';
        }

        document.getElementById('msgInput').oninput = function() {
            document.getElementById('sendBtn').style.display = this.value.trim() ? 'block' : 'none';
        };

        document.getElementById('msgInput').onkeypress = (e) => { if(e.key==='Enter') send(); };

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            db.ref('active_users').on('value', (s) => {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                s.forEach(u => {
                    const d = document.createElement('div');
                    d.className = 'admin-card';
                    d.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                            <strong>@${u.key}</strong>
                            <button onclick="banUser('${u.key}', -1)" style="color:var(--accent-gold); background:none; border:none; font-weight:800;">فك القيد</button>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <button onclick="banUser('${u.key}', 60)" style="padding:10px; border-radius:12px; background:rgba(255,255,255,0.05); color:#fff; border:none;">دقيقة</button>
                            <button onclick="banUser('${u.key}', 0)" style="padding:10px; border-radius:12px; background:rgba(255,75,43,0.1); color:#ff3b30; border:none;">مؤبد</button>
                        </div>
                    `;
                    list.appendChild(d);
                });
            });
        }

        function banUser(user, sec) {
            if(sec === -1) { db.ref('banned_users/' + user).remove(); return showToast("تم العفو الملكي"); }
            const exp = sec === 0 ? 9999999999999 : Date.now() + (sec * 1000);
            db.ref('banned_users/' + user).set({ expiry: exp });
            showToast("تم تقييد المستخدم");
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        function nuclearWipe() { if(confirm("تصفير المجلس؟")) db.ref('messages').remove(); }

        function showBannedView(exp) {
            document.getElementById('chat-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('banned-screen').style.display = 'flex';
            const timer = setInterval(() => {
                const diff = exp - Date.now();
                if(diff <= 0) { clearInterval(timer); location.reload(); }
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('timer-display').innerText = exp > 2000000000000 ? "مؤبد" : `${m}:${s<10?'0'+s:s}`;
            }, 1000);
        }

        if(currentUser) checkBan(currentUser);
    </script>
</body>
</html>
