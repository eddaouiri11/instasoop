<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Premium Design</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --blue-action: #0095f6;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --text-main: #262626;
            --text-secondary: #8e8e8e;
            --border-color: #dbdbdb;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        html, body { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            overflow: hidden; 
            background: var(--insta-gradient); 
            display: flex;
            justify-content: center;
        }

        /* login screen with full background */
        .overlay-screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            z-index: 3000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }

        .insta-logo { 
            font-size: 3.8rem; 
            color: var(--text-main); 
            font-family: 'Grand Hotel', cursive; 
            margin-bottom: 25px; 
            display: block;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 14px 15px;
            border-radius: 12px;
            color: var(--text-main);
            margin-bottom: 15px;
            outline: none;
            font-size: 15px;
        }

        .btn-primary {
            width: 100%;
            background: var(--blue-action);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(0, 149, 246, 0.3);
        }

        /* App Container */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        header {
            padding: 0 16px;
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .header-logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 2.2rem;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fdfdfd;
        }

        /* Message Bubbles */
        .msg { max-width: 82%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 2px; padding: 0 10px; font-weight: 600; }
        
        .bubble { 
            padding: 12px 16px; 
            border-radius: 22px; 
            font-size: 0.98rem; 
            line-height: 1.4; 
        }

        .sent { align-self: flex-end; }
        .sent .bubble { 
            background: var(--insta-gradient); 
            color: white; 
            border-bottom-right-radius: 4px;
        }
        .sent .u-name { display: none; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { 
            background: #efefef; 
            color: var(--text-main); 
            border-bottom-left-radius: 4px;
        }

        /* Bottom Input Fixed */
        .input-container {
            padding: 10px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid var(--border-color);
        }

        .input-bar {
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            padding: 5px 18px;
            align-items: center;
            background: #fff;
        }

        #msgInput {
            border: none;
            background: transparent;
            flex: 1;
            color: var(--text-main);
            padding: 10px 0;
            outline: none;
            font-size: 16px;
        }

        .send-txt {
            color: var(--blue-action);
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            padding-left: 5px;
        }

        /* Ban & Admin Screens */
        #banned-screen {
            background: #fff;
            position: fixed; inset: 0;
            z-index: 5000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px; text-align: center;
        }

        #admin-panel {
            position: fixed; inset: 0;
            background: #fff; z-index: 6000;
            display: none; flex-direction: column; padding: 20px;
        }

        .admin-card {
            background: #f8f8f8;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }

        .timer-box {
            font-size: 2rem;
            font-weight: 900;
            color: var(--blue-action);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="login-screen" class="overlay-screen">
        <div class="login-card">
            <span class="insta-logo">Instasoop</span>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="btn-primary" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Banned -->
    <div id="banned-screen">
        <div style="font-size: 5rem; margin-bottom: 10px;">🚫</div>
        <h2 style="margin:0;">تم إيقاف حسابك</h2>
        <p style="color: var(--text-secondary); margin: 15px 0;">حسابك محظور من الدردشة بسبب مخالفة القوانين.</p>
        <div id="timer-display" class="timer-box">00</div>
        <p style="font-size: 0.8rem; color: var(--text-secondary);">ثانية متبقية لفك الحظر</p>
    </div>

    <!-- Main App -->
    <div id="chat-app">
        <header>
            <div class="header-logo">Instasoop</div>
            <div id="displayUser" style="color: var(--blue-action); font-weight: 700; font-size: 0.9rem;"></div>
        </header>
        
        <div id="chat-box"></div>
        
        <div class="input-container">
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div class="send-txt" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <!-- Admin -->
    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; align-items:center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
            <h2 style="margin:0;">الإشراف</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; font-size:1.8rem; cursor:pointer;">✕</button>
        </div>
        <div style="display:flex; gap: 10px; margin-bottom: 15px;">
            <button onclick="unbanAll()" style="flex:1; padding:12px; border-radius:10px; border:1px solid #ddd;">إلغاء حظر الجميع</button>
            <button onclick="nuclearWipe()" style="flex:1; padding:12px; border-radius:10px; background:#ed4956; color:white; border:none;">تصفير الشات</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "Unknown";
        const ADMIN_CODE = "20102010";

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {}

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkUserStatus(saved);
            else showScreen('login-screen');
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkUserStatus(val);
        }

        function checkUserStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const ban = snap.val();
                if (ban) {
                    const now = Date.now();
                    if (ban.expiry && now > ban.expiry) {
                        db.ref('banned_users/' + name).remove();
                    } else {
                        showScreen('banned-screen');
                        if (ban.expiry) startTimer(ban.expiry);
                        return;
                    }
                }
                
                if (!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + name.toLowerCase();
                    showScreen('chat-app');
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMessages();
                }
            });
        }

        function startTimer(expiry) {
            const disp = document.getElementById('timer-display');
            const timer = setInterval(() => {
                const diff = expiry - Date.now();
                if (diff <= 0) { 
                    clearInterval(timer); 
                    location.reload(); 
                } else {
                    disp.innerText = Math.floor(diff/1000);
                }
            }, 1000);
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app, #banned-screen').forEach(s => s.style.display = 'none');
            const el = document.getElementById(id);
            if(el) el.style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (txt === ADMIN_CODE) { openAdmin(); input.value = ''; return; }
            if (!txt) return;
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(u => {
                    const n = u.key;
                    const div = document.createElement('div');
                    div.className = 'admin-card';
                    div.innerHTML = `<div><b>${n}</b></div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="applyBan('${n}', 60)" style="padding:5px 8px; border-radius:5px; border:1px solid #ddd;">1د</button>
                        <button onclick="applyBan('${n}', 3600)" style="padding:5px 8px; border-radius:5px; border:1px solid #ddd;">1س</button>
                        <button onclick="applyBan('${n}', 0)" style="padding:5px 8px; border-radius:5px; background:#ed4956; color:white; border:none;">دائم</button>
                    </div>`;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(name, sec) {
            const exp = sec === 0 ? null : Date.now() + (sec * 1000);
            db.ref('banned_users/' + name).set({ banned: true, expiry: exp });
        }

        function unbanAll() { db.ref('banned_users').remove(); }
        function nuclearWipe() { if(confirm("حذف كل الرسائل؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

        init();
    </script>
</body>
</html>
