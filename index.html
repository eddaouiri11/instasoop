<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | الدردشة</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --bg: #fafafa;
            --white: #ffffff;
            --border: #dbdbdb;
            --text: #262626;
            --dim: #8e8e8e;
            --danger: #ed4956;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; }

        .overlay-screen {
            position: fixed; inset: 0; background: var(--white);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .insta-logo { font-size: 3rem; font-weight: bold; font-style: italic; margin-bottom: 30px; color: var(--text); font-family: 'Grand Hotel', cursive, sans-serif; }

        input {
            width: 100%; max-width: 300px; background: #fafafa; border: 1px solid var(--border);
            padding: 12px; border-radius: 5px; color: var(--text); margin-bottom: 10px; outline: none; font-size: 14px;
        }

        .btn-insta {
            width: 100%; max-width: 300px; background: var(--insta-blue); color: white;
            border: none; padding: 10px; border-radius: 5px; font-weight: 700; cursor: pointer; transition: opacity 0.3s;
        }

        #chat-app { display: none; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: var(--white); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        header {
            padding: 10px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; background: var(--white);
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: var(--white); }
        
        .msg { max-width: 75%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.7rem; color: var(--dim); margin-bottom: 2px; padding: 0 8px; font-weight: 600; }
        .bubble { padding: 8px 12px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; border: 1px solid var(--border); }

        .sent { align-self: flex-end; }
        .sent .bubble { background: #efefef; color: var(--text); border: none; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: var(--white); color: var(--text); }

        .input-area { padding: 15px; background: var(--white); }
        .input-wrapper { border: 1px solid var(--border); border-radius: 25px; display: flex; padding: 2px 15px; align-items: center; }
        #msgInput { border: none; background: transparent; flex: 1; color: var(--text); padding: 10px 0; outline: none; margin:0; }

        /* Admin Panel Styles */
        #admin-panel { position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 4000; display: none; flex-direction: column; padding: 20px; color: #000; }
        .admin-item { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ban-options button { padding: 5px 10px; font-size: 11px; margin-left: 3px; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="insta-logo">Instasoop</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
        <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
    </div>

    <div id="banned-screen" class="overlay-screen">
        <div style="font-size: 5rem;">🚫</div>
        <h2 style="color: var(--danger);">تم حظر الحساب</h2>
        <p id="ban-msg" style="color: var(--dim); text-align: center; max-width: 80%;">هذا الحساب محظور من دخول الدردشة بسبب مخالفة القوانين.</p>
        <p id="timer-display" style="font-weight: bold; color: var(--insta-blue); margin-top: 10px;"></p>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px;">Instasoop</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600; font-size: 0.9rem;"></div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div style="color:var(--insta-blue); font-weight:bold; cursor:pointer; font-size: 0.9rem;" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin:0;">التحكم</h2>
            <button onclick="closeAdmin()" style="background: none; border: none; font-size: 1.5rem; cursor:pointer;">✕</button>
        </div>
        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button onclick="unbanAll()" style="flex: 1; padding: 10px; background: #eee; border: 1px solid #ccc; border-radius: 8px; cursor:pointer;">إلغاء حظر الكل</button>
            <button onclick="nuclearWipe()" style="flex: 1; padding: 10px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor:pointer;">مسح الرسائل</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "";
        const ADMIN_CODE = "20102010";

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) { userIP = "Unknown"; }

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkUserStatus(saved);
            else showScreen('login-screen');
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkUserStatus(val);
        }

        function checkUserStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const banData = snap.val();
                if (banData) {
                    const now = Date.now();
                    if (banData.expiry && now > banData.expiry) {
                        // Ban expired!
                        db.ref('banned_users/' + name).remove();
                    } else {
                        showScreen('banned-screen');
                        if (banData.expiry) {
                            startTimer(banData.expiry);
                        }
                        return;
                    }
                }
                
                if (!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = name;
                    showScreen('chat-app');
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMessages();
                }
            });
        }

        function startTimer(expiry) {
            const display = document.getElementById('timer-display');
            const interval = setInterval(() => {
                const timeLeft = expiry - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    location.reload();
                } else {
                    const secs = Math.floor(timeLeft / 1000);
                    display.innerText = `سينتهي الحظر بعد: ${secs} ثانية`;
                }
            }, 1000);
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (txt === ADMIN_CODE) { openAdmin(); input.value = ''; return; }
            if (!txt) return;
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(u => {
                    const name = u.key;
                    const div = document.createElement('div');
                    div.className = 'admin-item';
                    div.innerHTML = `
                        <div><b>${name}</b></div>
                        <div class="ban-options">
                            <button onclick="applyBan('${name}', 30)">30s</button>
                            <button onclick="applyBan('${name}', 3600)">1h</button>
                            <button onclick="applyBan('${name}', 86400)">24h</button>
                            <button onclick="applyBan('${name}', 0)" style="background:red; color:white;">Perm</button>
                        </div>`;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(name, seconds) {
            const expiry = seconds === 0 ? null : Date.now() + (seconds * 1000);
            db.ref('banned_users/' + name).set({
                banned: true,
                expiry: expiry
            });
            alert(`تم حظر ${name}`);
        }

        function unbanAll() { if(confirm("فك الحظر عن الجميع؟")) db.ref('banned_users').remove(); }
        function nuclearWipe() { if(confirm("مسح الشات؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

        init();
    </script>
</body>
</html>
