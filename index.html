<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LUXY PRO | EXCLUSIVE EDITION</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --luxy-gold: linear-gradient(135deg, #d4af37 0%, #fcf6ba 45%, #aa771c 100%);
            --luxy-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.2);
            --accent-gold: #d4af37;
            --premium-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Amiri', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--luxy-dark);
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.08), transparent 400px);
            color: #fff; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: var(--luxy-dark); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        .avatar-selector {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 30px 0;
            padding: 15px; background: var(--glass); border-radius: 25px; border: 1px solid var(--glass-border);
        }

        .avatar-option {
            width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.3s; padding: 2px;
        }

        .avatar-option.selected { border-color: var(--accent-gold); transform: scale(1.1); box-shadow: var(--premium-shadow); }

        /* Chat UI */
        .luxy-navbar {
            padding: 15px 25px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between;
        }

        .user-info-box { display: flex; align-items: center; gap: 12px; }
        .nav-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent-gold); }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth; background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }

        /* Message Bubbles */
        .msg { max-width: 85%; position: relative; animation: slideUp 0.4s ease; display: flex; gap: 10px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } }

        .luxy-bubble {
            padding: 12px 18px; border-radius: 20px; position: relative;
            backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            word-wrap: break-word;
        }

        .sent { align-self: flex-end; flex-direction: row-reverse; }
        .sent .luxy-bubble { 
            background: linear-gradient(135deg, rgba(40,40,40,0.9), rgba(10,10,10,0.9)); 
            border-bottom-right-radius: 4px; border-right: 2px solid var(--accent-gold);
        }

        .recv { align-self: flex-start; }
        .recv .luxy-bubble { 
            background: rgba(255,255,255,0.05); 
            border-bottom-left-radius: 4px;
        }

        /* Effects Styles */
        .premium-decoration {
            position: absolute; inset: -2px; border-radius: 22px; z-index: -1; opacity: 0.4; filter: blur(6px);
        }
        .effect-gold { background: var(--luxy-gold); animation: pulseGlow 2s infinite; }
        .effect-fire { background: linear-gradient(to top, #ff4e50, #f9d423); animation: pulseGlow 1s infinite; }
        .effect-lightning { background: linear-gradient(to top, #00d2ff, #3a7bd5); animation: pulseGlow 0.5s infinite; }

        @keyframes pulseGlow { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.02); } }

        /* Footer */
        .luxy-footer { padding: 20px; background: rgba(0,0,0,0.8); }
        .input-wrapper {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 30px; display: flex; align-items: center; padding: 5px 15px;
        }

        #msgInput {
            flex: 1; background: none; border: none; outline: none; color: white;
            padding: 12px; font-size: 15px; text-align: right;
        }

        .send-icon-btn {
            background: var(--luxy-gold); width: 40px; height: 40px; border-radius: 50%;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--premium-shadow); margin-left: 10px;
        }

        #decor-panel {
            display: none; position: absolute; bottom: 90px; left: 20px; right: 20px;
            background: #111; border: 1px solid var(--accent-gold); border-radius: 20px;
            padding: 15px; z-index: 100;
        }

        .decor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .decor-option {
            padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px;
            text-align: center; font-size: 13px; cursor: pointer; border: 1px solid transparent;
        }
        .decor-option.active { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-family:'Cinzel'; color:var(--accent-gold); font-size: 3rem; margin-bottom:10px;">LUXY</h1>
        <p style="color:#888; font-size:12px; letter-spacing:2px;">CHOOSE YOUR IDENTITY</p>
        
        <div class="avatar-selector" id="avatarList"></div>

        <div style="width: 100%; max-width: 320px;">
            <input type="text" id="usernameInput" placeholder="أدخل لقبك الملكي..." 
                   style="width:100%; padding:18px; background:var(--glass); border:1px solid var(--glass-border); border-radius:20px; color:white; text-align:center; margin-bottom:20px; outline:none;">
            <button onclick="startApp()" 
                    style="width:100%; padding:18px; background:var(--luxy-gold); border:none; border-radius:50px; font-weight:800; cursor:pointer; color:black;">دخول المجلس</button>
        </div>
    </div>

    <div id="chat-app" style="display:none; height:100%;">
        <nav class="luxy-navbar">
            <div class="user-info-box">
                <img id="headerAvatar" class="nav-avatar" src="">
                <div>
                    <h3 id="headerName" style="font-size:14px;">---</h3>
                    <span style="font-size:9px; color:var(--accent-gold);">● متصل الآن</span>
                </div>
            </div>
            <div onclick="location.reload()" style="cursor:pointer; color:var(--accent-gold); font-size:20px;">✨</div>
        </nav>

        <main id="chat-box"></main>

        <div id="decor-panel">
            <h4 style="font-size:12px; margin-bottom:10px; color:var(--accent-gold); text-align:center;">تأثيرات الرسائل الملكية</h4>
            <div class="decor-grid">
                <div class="decor-option" id="eff-none" onclick="setEffect('none')">عادي</div>
                <div class="decor-option" id="eff-gold" onclick="setEffect('gold')">وهج ذهبي ✨</div>
                <div class="decor-option" id="eff-fire" onclick="setEffect('fire')">لهب ملكي 🔥</div>
                <div class="decor-option" id="eff-lightning" onclick="setEffect('lightning')">برق خاطف ⚡</div>
            </div>
        </div>

        <footer class="luxy-footer">
            <div class="input-wrapper">
                <button onclick="toggleDecor()" style="background:none; border:none; font-size:22px; cursor:pointer;">🎨</button>
                <input type="text" id="msgInput" placeholder="اكتب رسالة تليق بمقامك..." autocomplete="off">
                <button onclick="send()" class="send-icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        const SEC_KEY = "luxy_ultra_secret_1337";
        let selectedAvatarUrl = "";
        let currentEffect = "none";

        // Initialize Avatars
        const avatarContainer = document.getElementById('avatarList');
        for(let i=1; i<=8; i++) {
            const img = document.createElement('img');
            const seed = "luxy" + i;
            img.src = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${seed}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
            img.className = 'avatar-option';
            if(i===1) { img.classList.add('selected'); selectedAvatarUrl = img.src; }
            img.onclick = function() {
                document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
                this.classList.add('selected');
                selectedAvatarUrl = this.src;
            };
            avatarContainer.appendChild(img);
        }

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            databaseURL: "https://instasoop-230e0-default-rtdb.firebaseio.com",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function encrypt(text) { return CryptoJS.AES.encrypt(text, SEC_KEY).toString(); }
        function decrypt(cipher) {
            try { return CryptoJS.AES.decrypt(cipher, SEC_KEY).toString(CryptoJS.enc.Utf8); }
            catch(e) { return "رسالة مشفرة"; }
        }

        function toggleDecor() {
            const p = document.getElementById('decor-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function setEffect(eff) {
            currentEffect = eff;
            document.querySelectorAll('.decor-option').forEach(el => el.classList.remove('active'));
            document.getElementById('eff-' + eff).classList.add('active');
            toggleDecor();
        }

        function startApp() {
            const user = document.getElementById('usernameInput').value.trim();
            if(user.length < 2) return alert("الاسم قصير جداً");
            
            localStorage.setItem('luxy_user', user);
            localStorage.setItem('luxy_avatar', selectedAvatarUrl);
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = selectedAvatarUrl;
            document.getElementById('headerName').innerText = user;
            
            loadMessages();
        }

        function loadMessages() {
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === localStorage.getItem('luxy_user');
                    const text = decrypt(m.text);
                    
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    
                    let effectClass = m.effect && m.effect !== 'none' ? `effect-${m.effect}` : '';
                    let decoration = effectClass ? `<div class="premium-decoration ${effectClass}"></div>` : '';
                    
                    div.innerHTML = `
                        <img src="${m.avatar}" style="width:30px; height:30px; border-radius:50%; border:1px solid var(--accent-gold); margin-top:10px;">
                        <div style="display:flex; flex-direction:column; ${isMe ? 'align-items:flex-end' : 'align-items:flex-start'}">
                            <div style="font-size:10px; margin-bottom:4px; color:rgba(212,175,55,0.7);">${m.user}</div>
                            <div class="luxy-bubble">
                                ${decoration}
                                <span style="position:relative; z-index:1">${text}</span>
                            </div>
                        </div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;

            const payload = {
                user: localStorage.getItem('luxy_user'),
                avatar: localStorage.getItem('luxy_avatar'),
                text: encrypt(txt),
                effect: currentEffect,
                ts: Date.now()
            };

            db.ref('messages').push(payload);
            input.value = '';
        }

        document.getElementById('msgInput').onkeypress = (e) => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
