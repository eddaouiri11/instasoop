<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Blue Luxury</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text-main);
            height: 100%; width: 100%;
            overflow: hidden;
        }

        body { display: flex; justify-content: center; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1e3a8a, #020617);
            z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }

        .login-card {
            background: var(--surface);
            padding: 30px 20px; border-radius: 30px;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
            width: 100%; max-width: 340px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input {
            width: 100%; background: #1e293b; border: 2px solid #334155;
            padding: 14px; border-radius: 18px; color: white;
            font-size: 1rem; margin: 15px 0; outline: none; text-align: center;
        }

        .btn-primary {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; padding: 14px; border-radius: 18px;
            font-weight: bold; cursor: pointer;
        }

        /* Chat Layout */
        #chat-app { width: 100%; max-width: 500px; height: 100%; display: none; flex-direction: column; background: var(--bg); }

        header {
            padding: 12px 20px; padding-top: max(12px, env(safe-area-inset-top));
            background: var(--surface); display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 15px; display: flex;
            flex-direction: column; gap: 14px;
            background: url('https://www.transparenttextures.com/patterns/dark-matter.png');
        }

        .message-row { display: flex; flex-direction: column; max-width: 82%; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }

        .bubble { padding: 10px 15px; border-radius: 20px; font-size: 0.95rem; word-wrap: break-word; }
        .sent { align-self: flex-end; } .sent .bubble { background: var(--primary); border-top-left-radius: 4px; }
        .received { align-self: flex-start; } .received .bubble { background: var(--surface); border-top-right-radius: 4px; }

        .input-container {
            padding: 10px 15px; padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--surface); display: flex; gap: 10px; align-items: center;
        }

        /* Admin Overlay */
        #admin-panel {
            position: fixed; inset: 0; background: var(--bg); z-index: 200;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .user-row { background: var(--surface); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e3a8a; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div style="font-size: 4rem;">🥣</div>
            <h1 style="color: var(--primary);">Instasoop</h1>
            <input type="text" id="usernameInput" placeholder="اكتب اسمك..." maxlength="12">
            <button class="btn-primary" onclick="startApp()">ابدأ الآن</button>
        </div>
    </div>

    <div id="chat-app">
        <header>
            <span style="font-weight:900; color:var(--primary);">INSTASOOP</span>
            <span id="displayUser" style="font-size: 0.85rem; font-weight:600;"></span>
        </header>
        <div id="chat-box"></div>
        <div class="input-container">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
            <button class="btn-primary" style="width:46px; height:46px; border-radius:50%;" onclick="send()">✔</button>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:var(--primary)">لوحة Phoenix Dashboard</h2>
            <button onclick="closeAdmin()" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:10px;">إغلاق</button>
        </div>
        <div id="admin-users-list">جاري التحميل...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        const ADMIN_PASS = "20102010";

        window.onload = () => {
            const saved = localStorage.getItem('instasoop_user');
            if (saved) checkBanAndStart(saved);
            fixHeight();
        };

        function fixHeight() { document.body.style.height = window.innerHeight + "px"; }
        window.addEventListener('resize', fixHeight);

        function startApp() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name.length >= 2) checkBanAndStart(name);
            else alert("دخل سمية!");
        }

        function checkBanAndStart(name) {
            db.ref('banned_users/' + name).once('value', (snap) => {
                if (snap.exists()) {
                    alert("نتا مبنيدي من هاد الشات!");
                    localStorage.removeItem('instasoop_user');
                    location.reload();
                } else {
                    currentUser = name;
                    localStorage.setItem('instasoop_user', name);
                    document.getElementById('displayUser').innerText = currentUser;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    loadMessages();
                }
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const val = input.value.trim();
            if (!val) return;

            if (val === ADMIN_PASS) {
                openAdmin();
                input.value = '';
                return;
            }

            db.ref('messages').push({
                user: currentUser,
                text: val,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            input.value = '';
        }

        function loadMessages() {
            const box = document.getElementById('chat-box');
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `message-row ${isMe ? 'sent' : 'received'}`;
                    div.innerHTML = `<span style="font-size:0.7rem; color:var(--text-dim)">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Admin Functions
        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-users-list');
            db.ref('messages').once('value', (snap) => {
                list.innerHTML = '';
                const users = new Set();
                snap.forEach(c => users.add(c.val().user));
                users.forEach(u => {
                    db.ref('banned_users/' + u).on('value', (bSnap) => {
                        const isBanned = bSnap.exists();
                        const row = document.createElement('div');
                        row.className = 'user-row';
                        row.innerHTML = `<span>${u} ${isBanned ? '🚫' : '✅'}</span>
                        <button style="background:${isBanned ? 'var(--success)' : 'var(--danger)'}; color:white; border:none; padding:5px 10px; border-radius:5px;" 
                        onclick="toggleBan('${u}', ${isBanned})">${isBanned ? 'Unban' : 'Ban'}</button>`;
                        list.appendChild(row);
                    });
                });
            });
        }

        function toggleBan(u, isB) {
            if (!isB) { if(confirm("تبنيد " + u + "?")) db.ref('banned_users/' + u).set(true); }
            else { db.ref('banned_users/' + u).remove(); }
            openAdmin();
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
