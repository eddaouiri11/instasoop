<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Blue Premium</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #0095f6;
            --primary-dark: #0074cc;
            --bg: #000000;
            --surface: #121212;
            --text-main: #ffffff;
            --text-dim: #a8a8a8;
            --danger: #ed4956;
            --success: #00f2ea;
            --glass: rgba(25, 25, 25, 0.85);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text-main);
            height: 100%; width: 100%;
            overflow: hidden;
        }

        /* Scrollbar Styling */
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0;
            background: linear-gradient(45deg, #001529, #000000);
            z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }

        .login-card {
            background: var(--surface);
            padding: 40px 25px; border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 149, 246, 0.15);
            width: 100%; max-width: 350px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2.5rem; font-weight: bold;
            background: linear-gradient(to right, #0095f6, #00f2ea);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        input {
            width: 100%; background: #262626; border: 1px solid #363636;
            padding: 12px; border-radius: 10px; color: white;
            font-size: 0.9rem; margin-bottom: 15px; outline: none; text-align: center;
        }

        input:focus { border-color: var(--text-dim); }

        .btn-primary {
            width: 100%; background: var(--primary);
            color: white; border: none; padding: 12px; border-radius: 10px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
        }

        .btn-primary:active { transform: scale(0.98); opacity: 0.8; }

        /* Main Chat Layout */
        #chat-app { width: 100%; max-width: 500px; height: 100%; display: none; flex-direction: column; margin: 0 auto; border-right: 1px solid #262626; border-left: 1px solid #262626; }

        header {
            padding: 15px 20px; padding-top: max(15px, env(safe-area-inset-top));
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #262626; position: sticky; top: 0; z-index: 100;
        }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 20px 15px; display: flex;
            flex-direction: column; gap: 12px;
            background: var(--bg);
        }

        .message-row { display: flex; flex-direction: column; max-width: 85%; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }

        .user-tag { font-size: 0.75rem; margin-bottom: 4px; font-weight: 600; color: var(--text-dim); }
        .bubble { padding: 12px 16px; border-radius: 22px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        
        .sent { align-self: flex-end; } 
        .sent .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .sent .user-tag { align-self: flex-end; color: var(--primary); }

        .received { align-self: flex-start; } 
        .received .bubble { background: #262626; color: white; border-bottom-left-radius: 4px; border: 1px solid #333; }

        .input-container {
            padding: 15px; padding-bottom: max(15px, env(safe-area-inset-bottom));
            background: var(--bg); display: flex; gap: 10px; align-items: center;
            border-top: 1px solid #262626;
        }

        #msgInput { margin: 0; border-radius: 25px; padding: 12px 20px; text-align: right; }

        /* Admin Dashboard */
        #admin-panel {
            position: fixed; inset: 0; background: #000; z-index: 2000;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .admin-item { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div class="logo-text">Instasoop</div>
            <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 0.8rem;">سجل دخولك للمتابعة</p>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="btn-primary" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight:800; font-size: 1.2rem; letter-spacing: -0.5px;">Instasoop</div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span id="displayUser" style="font-size: 0.8rem; color: var(--primary); font-weight:bold;"></span>
                <div style="width:8px; height:8px; background:var(--success); border-radius:50%; box-shadow: 0 0 8px var(--success);"></div>
            </div>
        </header>

        <div id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="msgInput" placeholder="رسالة..." autocomplete="off">
            <button class="btn-primary" style="width:auto; padding: 10px 20px; border-radius: 20px;" onclick="send()">إرسال</button>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 style="font-size: 1.5rem;">Control Center</h1>
            <button onclick="closeAdmin()" style="background:none; border:1px solid #ed4956; color:#ed4956; padding:8px 15px; border-radius:8px;">إغلاق</button>
        </div>
        <div id="admin-users-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        const PHOENIX_KEY = "20102010";

        // Logic للحفاظ على تسجيل الدخول
        window.onload = () => {
            const savedUser = localStorage.getItem('instasoop_session');
            if (savedUser) {
                checkBanAndStart(savedUser);
            }
            fixHeight();
        };

        function fixHeight() { document.body.style.height = window.innerHeight + "px"; }
        window.addEventListener('resize', fixHeight);

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 3) checkBanAndStart(val);
            else alert("السمية قصيرة بزاف!");
        }

        function checkBanAndStart(name) {
            db.ref('banned_users/' + name).once('value', (snap) => {
                if (snap.exists()) {
                    alert("عذراً، حسابك محظور!");
                    localStorage.removeItem('instasoop_session');
                    location.reload();
                } else {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + currentUser;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('chat-app').style.display = 'flex';
                    loadMessages();
                }
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            if (msg === PHOENIX_KEY) {
                openAdmin();
                input.value = '';
                return;
            }

            db.ref('messages').push({
                user: currentUser,
                text: msg,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        }

        function loadMessages() {
            const chatBox = document.getElementById('chat-box');
            db.ref('messages').limitToLast(50).on('value', (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    const isMe = data.user === currentUser;
                    const row = document.createElement('div');
                    row.className = `message-row ${isMe ? 'sent' : 'received'}`;
                    row.innerHTML = `
                        <span class="user-tag">${data.user}</span>
                        <div class="bubble">${data.text}</div>
                    `;
                    chatBox.appendChild(row);
                });
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            });
        }

        // Admin Engine
        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-users-list');
            db.ref('messages').once('value', (snap) => {
                list.innerHTML = '';
                const users = new Set();
                snap.forEach(c => users.add(c.val().user));
                users.forEach(u => {
                    db.ref('banned_users/' + u).on('value', (bSnap) => {
                        const banned = bSnap.exists();
                        const item = document.createElement('div');
                        item.className = 'admin-item';
                        item.innerHTML = `
                            <span>${u} ${banned ? '🚫' : '💎'}</span>
                            <button onclick="toggleBan('${u}', ${banned})" 
                                style="background:${banned ? '#00f2ea' : '#ed4956'}; color:black; border:none; padding:5px 12px; border-radius:6px; font-weight:bold;">
                                ${banned ? 'Unban' : 'Ban'}
                            </button>
                        `;
                        list.appendChild(item);
                    });
                });
            });
        }

        function toggleBan(user, isBanned) {
            if (!isBanned) {
                if(confirm("تبنيد " + user + "?")) db.ref('banned_users/' + user).set(true);
            } else {
                db.ref('banned_users/' + user).remove();
            }
            openAdmin();
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
