<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 500px;
            background: #000;
            position: relative;
        }

        /* Login */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .insta-logo {
            font-size: 3.5rem;
            font-family: 'Grand Hotel', cursive;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #usernameInput {
            width: 80%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #262626;
            background: #121212;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-btn {
            width: 80%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Header */
        .insta-header {
            height: 60px;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #262626;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }
        .avatar-img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 1px solid #333; }
        .user-info h2 { font-size: 15px; font-weight: bold; }
        .user-info p { font-size: 11px; color: #8e8e8e; }

        /* Chat Area */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg { max-width: 80%; display: flex; flex-direction: column; }
        .sent { align-self: flex-end; }
        .recv { align-self: flex-start; }

        /* Username above bubble */
        .msg-user {
            font-size: 11px;
            color: #8e8e8e;
            margin-bottom: 3px;
            margin-right: 5px;
            margin-left: 5px;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .sent .bubble { background: #3797f0; color: white; border-bottom-right-radius: 4px; }
        .recv .bubble { background: #262626; color: white; border-bottom-left-radius: 4px; }

        /* Footer */
        .input-footer { padding: 10px; border-top: 1px solid #262626; }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #262626;
            border-radius: 25px;
            padding: 5px 15px;
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px;
            font-size: 15px;
        }

        .send-btn { color: #0095f6; font-weight: bold; background: none; border: none; font-size: 15px; display: none; }

        /* Admin Panel */
        #admin-panel {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 6000;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .admin-user-card {
            padding: 15px;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ban-btn { padding: 5px 10px; border-radius: 5px; border: none; color: white; font-weight: bold; cursor: pointer; }

        #banned-screen {
            position: fixed; inset: 0; background: #000; z-index: 5000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="insta-logo">Instasoop</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم">
        <button class="login-btn" onclick="startApp()">دخول</button>
    </div>

    <div id="chat-app">
        <div class="insta-header">
            <div class="header-left">
                <span style="font-size: 20px;">←</span>
                <img id="headerAvatar" class="avatar-img" src="" alt="">
                <div class="user-info">
                    <h2 id="headerName">Instasoop</h2>
                    <p>متصل الآن</p>
                </div>
            </div>
            <div class="header-right">
                <span style="font-size: 20px; margin-left: 15px;">📞</span>
                <span style="font-size: 20px;">📹</span>
                </div>
        </div>

        <div id="chat-box"></div>

        <div class="input-footer">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <button id="sendBtn" class="send-btn" onclick="send()">إرسال</button>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2>لوحة الإدارة</h2>
            <button onclick="closeAdmin()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
        </div>
        <div id="admin-list"></div>
        <button onclick="nuclearWipe()" style="background:red; color:white; padding:15px; border-radius:10px; margin-top:20px; border:none; font-weight:bold;">مسح الكل</button>
    </div>

    <div id="banned-screen">
        <h1 style="font-size: 50px;">🚫</h1>
        <h2>الحساب محظور</h2>
        <div id="timer-display" style="font-size: 30px; color: orange; margin-top: 10px;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = localStorage.getItem('instasoop_name') || "";

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val.length < 2) return alert("الاسم قصير");
            checkStatus(val);
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).once('value', (s) => {
                const b = s.val();
                if(b && b.expiry && Date.now() < b.expiry) {
                    showBanned(b.expiry);
                } else {
                    login(name);
                }
            });
        }

        function login(name) {
            currentUser = name;
            localStorage.setItem('instasoop_name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${name}`;
            document.getElementById('headerName').innerText = name;
            db.ref('active_users/' + name).set({ ts: Date.now() });
            loadMessages();
        }

        function loadMessages() {
            db.ref('messages').limitToLast(100).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach((child) => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `
                        <div class="msg-user">${m.user}</div>
                        <div class="bubble">${m.text}</div>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;

            if(txt === "20102010") {
                openAdmin();
                input.value = "";
                return;
            }

            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = "";
            document.getElementById('sendBtn').style.display = 'none';
        }

        document.getElementById('msgInput').addEventListener('input', function() {
            document.getElementById('sendBtn').style.display = this.value.trim() ? 'block' : 'none';
        });

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            db.ref('active_users').on('value', (s) => {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                s.forEach((u) => {
                    const div = document.createElement('div');
                    div.className = 'admin-user-card';
                    div.innerHTML = `
                        <span>@${u.key}</span>
                        <div>
                            <button class="ban-btn" style="background:orange" onclick="applyBan('${u.key}', 60)">1د</button>
                            <button class="ban-btn" style="background:red" onclick="applyBan('${u.key}', 0)">مؤبد</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(user, sec) {
            const exp = sec === 0 ? 9999999999999 : Date.now() + (sec * 1000);
            db.ref('banned_users/' + user).set({ expiry: exp });
            alert("تم حظر " + user);
        }

        function nuclearWipe() {
            if(confirm("تمسح كلشي؟")) db.ref('messages').remove();
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function showBanned(exp) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('banned-screen').style.display = 'flex';
            setInterval(() => {
                const diff = exp - Date.now();
                if(diff <= 0) location.reload();
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            }, 1000);
        }

        if(currentUser) checkStatus(currentUser);
    </script>
</body>
</html>
