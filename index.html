<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram | Instasoop</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --bg: #000000;
            --border: #262626;
            --text: #ffffff;
            --dim: #a8a8a8;
            --danger: #ed4956;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; }

        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .insta-logo { font-size: 3.5rem; font-weight: bold; font-style: italic; margin-bottom: 40px; letter-spacing: -2px; }

        input {
            width: 100%; max-width: 350px; background: #121212; border: 1px solid #363636;
            padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px; outline: none;
        }

        .btn-insta {
            width: 100%; max-width: 350px; background: var(--insta-blue); color: white;
            border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        #chat-app { display: none; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; }

        header {
            padding: 15px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.75rem; color: var(--dim); margin-bottom: 4px; padding: 0 5px; }
        .bubble { padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; }

        .sent { align-self: flex-end; }
        .sent .bubble { background: var(--insta-blue); color: white; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: #262626; color: white; }

        .input-area { padding: 15px; border-top: 1px solid var(--border); }
        .input-wrapper { background: #121212; border: 1px solid #363636; border-radius: 30px; display: flex; padding: 5px 15px; }
        #msgInput { border: none; background: transparent; flex: 1; color: white; padding: 10px 0; outline: none; margin:0; }

        #admin-panel { position: fixed; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; padding: 20px; }
        .admin-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="insta-logo">Instagram</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
        <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
    </div>

    <div id="banned-screen" class="overlay-screen">
        <div style="font-size: 5rem;">🚫</div>
        <h2 style="color: var(--danger);">تم حظر الحساب</h2>
        <p style="color: var(--dim); text-align: center;">هذا الحساب محظور حالياً من استخدام الدردشة.</p>
        <button class="btn-insta" style="background:#333; margin-top:20px;" onclick="location.reload()">الرجوع للرئيسية</button>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight: 800; font-size: 1.4rem;">Instagram</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600;"></div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div style="color:var(--insta-blue); font-weight:bold; cursor:pointer;" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px;">
            <h2>Admin Control</h2>
            <button onclick="closeAdmin()" style="color: white; background: none; border: none; font-size: 1.5rem;">✕</button>
        </div>
        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button onclick="unbanAll()" style="flex: 1; padding: 12px; background: #333; color: white; border: none; border-radius: 8px;">إلغاء حظر الكل</button>
            <button onclick="nuclearWipe()" style="flex: 1; padding: 12px; background: var(--danger); color: white; border: none; border-radius: 8px;">مسح الشات</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "";
        const ADMIN_CODE = "20102010";

        // Getting IP only for display purposes in admin, not for banning
        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip.replace(/\./g, '_');
            } catch (e) { userIP = "Unknown"; }

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkUserStatus(saved);
            else showScreen('login-screen');
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkUserStatus(val);
        }

        function checkUserStatus(name) {
            // Listen for ban status changes in real-time
            db.ref('banned_users/' + name).on('value', (snap) => {
                if (snap.exists()) {
                    showScreen('banned-screen');
                    localStorage.removeItem('instasoop_session');
                } else {
                    if (!currentUser) { // Only set up once
                        currentUser = name;
                        localStorage.setItem('instasoop_session', name);
                        document.getElementById('displayUser').innerText = "@" + name;
                        showScreen('chat-app');
                        db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                        loadMessages();
                    }
                }
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (txt === ADMIN_CODE) { openAdmin(); input.value = ''; return; }
            if (!txt) return;
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(u => {
                    const name = u.key;
                    const ip = u.val().ip;
                    const div = document.createElement('div');
                    div.className = 'admin-item';
                    div.innerHTML = `<div><b>${name}</b><br><small>IP: ${ip}</small></div>
                    <button onclick="banUser('${name}')" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">BAN</button>`;
                    list.appendChild(div);
                });
            });
        }

        function banUser(name) {
            if(confirm(`حظر حساب ${name}؟`)) {
                db.ref('banned_users/' + name).set(true);
                alert("تم حظر المستخدم: " + name);
            }
        }

        function unbanAll() {
            if(confirm("إلغاء حظر جميع الحسابات؟")) {
                db.ref('banned_users').remove();
            }
        }

        function nuclearWipe() { if(confirm("مسح كل الرسائل؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

        init();
    </script>
</body>
</html>
