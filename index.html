<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instagram | Instasoop</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --bg: #000000;
            --border: #262626;
            --text: #ffffff;
            --dim: #a8a8a8;
            --danger: #ff3b30;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0; padding: 0; background: var(--bg);
            color: var(--text); height: 100%; width: 100%;
            overflow: hidden;
        }

        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 30px;
        }

        .logo-text {
            font-size: 3rem; font-weight: bold; font-style: italic;
            margin-bottom: 40px; color: white; letter-spacing: -2px;
        }

        input {
            width: 100%; background: #121212; border: 1px solid #363636;
            padding: 14px; border-radius: 8px; color: white;
            font-size: 0.85rem; margin-bottom: 15px; outline: none;
        }

        .btn-insta {
            width: 100%; background: var(--insta-blue); color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: 700; cursor: pointer;
        }

        #chat-app { 
            display: none; flex-direction: column; height: 100%; 
            max-width: 500px; margin: 0 auto;
        }

        header {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; display: flex; flex-direction: column; }
        .u-name { font-size: 0.7rem; color: var(--dim); margin: 0 12px 2px; }
        .bubble { padding: 10px 16px; border-radius: 22px; font-size: 0.95rem; line-height: 1.4; }

        .sent { align-self: flex-end; }
        .sent .bubble { background: var(--insta-blue); color: white; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: #262626; color: white; border: 1px solid #333; }

        .input-area { padding: 12px; border-top: 1px solid var(--border); }
        .input-wrapper { background: #121212; border: 1px solid #363636; border-radius: 25px; display: flex; padding: 2px 15px; }
        #msgInput { border: none; background: transparent; flex: 1; color: white; padding: 10px 0; outline: none; }

        /* Admin Dashboard */
        #admin-panel { position: fixed; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; padding: 20px; }
        .admin-item { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="logo-text">Instagram</div>
        <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
        <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
    </div>

    <div id="banned-screen" class="overlay-screen">
        <div style="font-size: 4rem;">🚫</div>
        <h2 style="color: var(--danger);">الحساب محظور</h2>
        <p style="color: var(--dim);">تم حظر جهازك من دخول هذه الشبكة.</p>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight: 800; font-size: 1.3rem;">Instasoop</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600;"></div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="رسالة..." autocomplete="off">
                <div style="color:var(--insta-blue); font-weight:bold; cursor:pointer; align-self:center;" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <h2 style="border-bottom:1px solid #222; padding-bottom:10px;">Security Dashboard</h2>
        <button onclick="nuclearWipe()" style="width:100%; padding:15px; background:var(--danger); border:none; color:white; border-radius:10px; font-weight:bold; margin-bottom:20px;">BAN ALL & CLEAR CHAT (WIPE)</button>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
        <button onclick="closeAdmin()" style="width:100%; padding:15px; background:#333; border:none; color:white; border-radius:10px; margin-top:10px;">خروج</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "";
        const PHOENIX_KEY = "20102010";

        // مراقبة أمر المسح الشامل (Wipe)
        function watchWipe() {
            db.ref('last_wipe').on('value', (snap) => {
                const wipeTime = snap.val();
                const myLoginTime = localStorage.getItem('login_time');
                if (wipeTime && (!myLoginTime || myLoginTime < wipeTime)) {
                    localStorage.clear();
                    location.reload();
                }
            });
        }

        async function init() {
            watchWipe();
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip.replace(/\./g, '_');
                
                db.ref('banned_ips/' + userIP).on('value', (snap) => {
                    if (snap.exists()) showScreen('banned-screen');
                    else {
                        const saved = localStorage.getItem('instasoop_session');
                        if (saved) checkStatus(saved);
                        else showScreen('login-screen');
                    }
                });
            } catch (e) { showScreen('login-screen'); }
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) {
                localStorage.setItem('login_time', Date.now());
                checkStatus(val);
            }
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                if (snap.exists()) {
                    db.ref('banned_ips/' + userIP).set(true);
                    showScreen('banned-screen');
                } else {
                    if (!currentUser) {
                        currentUser = name;
                        localStorage.setItem('instasoop_session', name);
                        document.getElementById('displayUser').innerText = "@" + name;
                        showScreen('chat-app');
                        db.ref('active_users/' + name).set({ ip: userIP, time: Date.now() });
                        loadMessages();
                    }
                }
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            if (input.value.trim() === PHOENIX_KEY) { openAdmin(); input.value = ''; return; }
            if (!input.value.trim()) return;
            db.ref('messages').push({ user: currentUser, text: input.value, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Admin Actions
        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(child => {
                    list.innerHTML += `<div class="admin-item">
                        <span>${child.key} (${child.val().ip})</span>
                        <button onclick="db.ref('banned_users/${child.key}').set(true)" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">BAN</button>
                    </div>`;
                });
            });
        }

        // المسح الشامل لكل المستخدمين
        function nuclearWipe() {
            if(confirm("واش متأكد؟ غاتمسح كاع الشات وتخرج كاع المستخدمين؟")) {
                db.ref('messages').remove();
                db.ref('active_users').remove();
                db.ref('last_wipe').set(Date.now());
                alert("تم تنفيذ المسح الشامل!");
            }
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        init();
    </script>
</body>
</html>
