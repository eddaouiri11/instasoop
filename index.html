<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Luxy Pro</title>
    
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --luxy-gold: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --luxy-purple: #6b46c1;
            --luxy-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #d4af37;
            --msg-sent: linear-gradient(135deg, #8e2de2, #4a00e0);
            --msg-recv: rgba(255, 255, 255, 0.08);
            --danger: #ff4b2b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', 'Reem Kufi', sans-serif;
        }

        body {
            background-color: var(--luxy-dark);
            background-image: radial-gradient(circle at top right, #1a0b2e, transparent),
                              radial-gradient(circle at bottom left, #0d0d0d, transparent);
            color: white;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Luxury Animations */
        @keyframes gold-shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--luxy-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 30px;
        }

        .luxy-logo {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            background: var(--luxy-gold);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gold-shine 5s linear infinite;
            letter-spacing: -2px;
        }

        .login-card {
            width: 100%;
            max-width: 320px;
            position: relative;
        }

        #usernameInput {
            width: 100%;
            padding: 18px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: var(--luxy-gold);
            background-size: 200% auto;
            color: #000;
            border: none;
            border-radius: 200px;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        /* Main Chat Layout */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .luxy-header {
            height: 75px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .avatar-img { 
            width: 44px; 
            height: 44px; 
            border-radius: 15px; 
            background: var(--luxy-gold);
            padding: 1.5px;
        }
        .user-info h2 { font-size: 16px; font-weight: 700; color: #fff; }
        .user-info p { font-size: 11px; color: var(--accent); font-weight: 500; }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: transparent;
        }

        .msg { max-width: 80%; display: flex; flex-direction: column; position: relative; }
        .sent { align-self: flex-end; }
        .recv { align-self: flex-start; }

        .msg-user {
            font-size: 11px;
            color: var(--accent);
            margin: 0 12px 5px;
            font-weight: 600;
            text-transform: lowercase;
        }

        .bubble {
            padding: 14px 20px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            backdrop-filter: blur(5px);
        }

        .sent .bubble { 
            background: var(--msg-sent);
            color: white; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 20px rgba(74, 0, 224, 0.2);
        }
        
        .recv .bubble { 
            background: var(--msg-recv); 
            color: #eee; 
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        /* Footer Input */
        .input-footer { 
            padding: 15px 20px calc(20px + env(safe-area-inset-bottom)); 
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 5px 18px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(15px);
        }

        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 12px 0;
            font-size: 15px;
        }

        .send-btn { 
            color: var(--accent); 
            font-weight: 800; 
            background: none; 
            border: none; 
            font-size: 14px; 
            margin-right: 10px;
            display: none;
            text-transform: uppercase;
        }

        /* Admin UI - Luxy Style */
        #admin-panel {
            position: fixed; inset: 0; background: rgba(5,5,5,0.98); z-index: 10001;
            display: none; flex-direction: column; padding: 25px;
            backdrop-filter: blur(30px);
        }

        .admin-card {
            background: var(--glass); 
            padding: 20px; 
            border-radius: 24px;
            margin-bottom: 15px; 
            border: 1px solid var(--glass-border);
        }
        .admin-card-top strong { color: var(--accent); font-size: 18px; }
        .ban-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .ban-btn { 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            font-size: 12px; 
            font-weight: 700;
            background: rgba(255,255,255,0.05);
            color: white;
        }

        /* Banned Screen */
        #banned-screen {
            position: fixed; inset: 0; background: var(--luxy-dark); z-index: 11000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 40px;
        }
        .timer-display { 
            font-size: 60px; 
            font-weight: 800; 
            background: var(--luxy-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 20px 0; 
        }

        #toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--luxy-gold); color: #000; padding: 12px 30px; border-radius: 50px;
            font-size: 14px; font-weight: 800; z-index: 20000; display: none;
            box-shadow: 0 10px 40px rgba(212,175,55,0.4);
        }

        /* Custom Scrollbar */
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <!-- Login -->
    <div id="login-screen">
        <div class="luxy-logo">Instasoop</div>
        <div class="login-card">
            <input type="text" id="usernameInput" placeholder="اكتب اسمك الفخم" maxlength="15">
            <button class="login-btn" onclick="startApp()">تأكيد الهوية</button>
        </div>
    </div>

    <!-- Main Chat -->
    <div id="chat-app">
        <div class="luxy-header">
            <div class="header-left">
                <img id="headerAvatar" class="avatar-img" src="" alt="">
                <div class="user-info">
                    <h2 id="headerName">...</h2>
                    <p>المجلس الفاخر</p>
                </div>
            </div>
            <div class="header-right">
                <div style="background:var(--glass); padding:10px; border-radius:12px; border:1px solid var(--glass-border);">
                    <span style="font-size: 20px;">💎</span>
                </div>
            </div>
        </div>

        <div id="chat-box"></div>

        <div class="input-footer">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="أرسل رسالة راقية..." autocomplete="off">
                <button id="sendBtn" class="send-btn" onclick="send()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 style="font-weight:800; background:var(--luxy-gold); -webkit-background-clip:text; color:transparent;">التحكم الملكي</h1>
            <button onclick="closeAdmin()" style="background:var(--glass); border:none; color:white; padding:10px 15px; border-radius:15px; font-size:20px;">✕</button>
        </div>
        <div class="admin-list-container" style="flex:1; overflow-y:auto;" id="admin-list"></div>
        <button onclick="nuclearWipe()" style="background:var(--danger); color:white; padding:20px; border-radius:20px; border:none; font-weight:bold; margin-top:15px; box-shadow: 0 10px 20px rgba(255,75,43,0.3);">تطهير المجلس (حذف الكل)</button>
    </div>

    <!-- Banned Screen -->
    <div id="banned-screen">
        <div style="padding:40px; background:var(--glass); border:1px solid var(--glass-border); border-radius:40px; backdrop-filter:blur(20px);">
            <span style="font-size: 80px;">🔒</span>
            <h2 style="margin-top:20px; font-weight:800; letter-spacing:1px;">حساب مقيد</h2>
            <div class="timer-display" id="timer-display">00:00</div>
            <p style="color:var(--text-grey); font-size:15px; line-height:1.6;">لقد تم تقييد وصولك بسبب مخالفة القوانين الفاخرة.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = localStorage.getItem('instasoop_name') || "";

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display='none', 2500);
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if(val.length < 2) return showToast("الاسم قصير جداً");
            currentUser = val;
            checkBanStatus(val);
        }

        function checkBanStatus(name) {
            db.ref('banned_users/' + name).on('value', (s) => {
                const b = s.val();
                if(b && b.expiry && Date.now() < b.expiry) {
                    showBanned(b.expiry);
                } else {
                    if(document.getElementById('banned-screen').style.display === 'flex') location.reload();
                    initChat(name);
                }
            });
        }

        function initChat(name) {
            localStorage.setItem('instasoop_name', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            document.getElementById('headerAvatar').src = `https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${name}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
            document.getElementById('headerName').innerText = name;
            
            db.ref('active_users/' + name).set({ ts: Date.now() });
            
            db.ref('messages').limitToLast(60).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                const isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 100;
                box.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    const isMe = m.user === currentUser;
                    const d = document.createElement('div');
                    d.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    d.innerHTML = `
                        ${!isMe ? `<div class="msg-user">${m.user}</div>` : ''}
                        <div class="bubble">${m.text}</div>
                    `;
                    box.appendChild(d);
                });
                if(isAtBottom) box.scrollTop = box.scrollHeight;
            });
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if(!txt) return;
            if(txt === "20102010") return openAdmin();
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = "";
            document.getElementById('sendBtn').style.display = 'none';
        }

        document.getElementById('msgInput').oninput = function() {
            document.getElementById('sendBtn').style.display = this.value.trim() ? 'block' : 'none';
        };

        document.getElementById('msgInput').onkeypress = (e) => { if(e.key==='Enter') send(); };

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            db.ref('active_users').on('value', (s) => {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                s.forEach(u => {
                    const d = document.createElement('div');
                    d.className = 'admin-card';
                    d.innerHTML = `
                        <div class="admin-card-top" style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>@${u.key}</strong>
                            <button onclick="ban('${u.key}', -1)" style="color:var(--success); background:var(--glass); border:1px solid var(--glass-border); padding:8px 15px; border-radius:12px; font-weight:bold;">فك الحظر</button>
                        </div>
                        <div class="ban-actions">
                            <button class="ban-btn" onclick="ban('${u.key}', 30)">30 ثانية</button>
                            <button class="ban-btn" onclick="ban('${u.key}', 3600)">1 ساعة</button>
                            <button class="ban-btn" style="color:var(--danger)" onclick="ban('${u.key}', 0)">حظر دائم</button>
                            <button class="ban-btn" onclick="kick('${u.key}')">طرد سريع</button>
                        </div>
                    `;
                    list.appendChild(d);
                });
            });
        }

        function ban(user, sec) {
            if(sec === -1) { db.ref('banned_users/' + user).remove(); return showToast("تم فك الحظر الملكي"); }
            const exp = sec === 0 ? 9999999999999 : Date.now() + (sec * 1000);
            db.ref('banned_users/' + user).set({ expiry: exp });
            showToast("تم التقييد بنجاح");
        }

        function kick(user) { db.ref('active_users/' + user).remove(); showToast("تم الطرد"); }
        function nuclearWipe() { if(confirm("هل أنت متأكد من تصفير المجلس؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function showBanned(exp) {
            document.getElementById('chat-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('banned-screen').style.display = 'flex';
            const timer = setInterval(() => {
                const diff = exp - Date.now();
                if(diff <= 0) { clearInterval(timer); location.reload(); }
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('timer-display').innerText = exp > 2000000000000 ? "مؤبد" : `${m}:${s<10?'0'+s:s}`;
            }, 1000);
        }

        if(currentUser) checkBanStatus(currentUser);
    </script>
</body>
</html>
