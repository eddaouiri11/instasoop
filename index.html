<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Ultra Security</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --insta-blue: #0095f6;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --dim: #a8a8a8;
            --danger: #ff3b30;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            margin: 0; padding: 0; background: var(--bg);
            color: var(--text); height: 100%; width: 100%;
            overflow: hidden; overscroll-behavior-y: contain;
        }

        .overlay-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 3000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 30px;
            text-align: center;
        }

        .logo-insta {
            font-size: 2.8rem; font-weight: bold; font-style: italic;
            margin-bottom: 30px; background: white; 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%; background: #262626; border: 1px solid #363636;
            padding: 14px; border-radius: 8px; color: white;
            font-size: 0.9rem; margin-bottom: 12px; outline: none; text-align: center;
        }

        .btn-insta {
            width: 100%; background: var(--insta-blue); color: white;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: 700; cursor: pointer;
        }

        #chat-app { 
            display: none; flex-direction: column; height: 100%; 
            max-width: 500px; margin: 0 auto; background: var(--bg);
        }

        header {
            padding: 10px 16px; border-bottom: 1px solid #262626;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
        }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; display: flex; flex-direction: column; margin-bottom: 4px; }
        .u-name { font-size: 0.65rem; color: var(--dim); margin: 0 10px 2px; }
        .bubble { padding: 10px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.3; }

        .sent { align-self: flex-end; }
        .sent .bubble { background: #3797f0; color: white; border-bottom-right-radius: 4px; }
        
        .recv { align-self: flex-start; }
        .recv .bubble { background: #262626; color: white; border-bottom-left-radius: 4px; border: 1px solid #333; }

        .input-area { padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #262626; }
        .input-wrapper { flex: 1; background: #262626; border-radius: 25px; display: flex; align-items: center; padding: 2px 15px; }
        #msgInput { border: none; background: transparent; flex: 1; color: white; padding: 10px 0; outline: none; text-align: right; }

        #admin-panel { position: fixed; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; padding: 20px; }
        .admin-item { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .ip-text { font-size: 0.7rem; color: #555; display: block; }
    </style>
</head>
<body>

    <div id="login-screen" class="overlay-screen">
        <div class="login-card">
            <div class="logo-insta">Instasoop</div>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="btn-insta" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="banned-screen" class="overlay-screen">
        <div style="font-size: 4rem;">🚫</div>
        <h2 style="color: var(--danger);">جهازك محظور نهائياً</h2>
        <p style="color: var(--dim);">لا يمكنك إنشاء حساب جديد أو الدخول.<br>تم تسجيل عنوان الـ IP الخاص بك.</p>
    </div>

    <div id="chat-app">
        <header>
            <div style="font-weight: 800; font-size: 1.2rem;">Instasoop</div>
            <div id="displayUser" style="color: var(--insta-blue); font-weight: 600;"></div>
        </header>
        <div id="chat-box"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="رسالة..." autocomplete="off">
                <div style="color:var(--insta-blue); font-weight:bold; cursor:pointer;" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <div id="admin-panel">
        <h2 style="border-bottom:1px solid #222; padding-bottom:10px;">Security Dashboard</h2>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
        <button onclick="closeAdmin()" style="width:100%; padding:15px; background:#222; border:none; color:white; border-radius:10px; margin-top:10px;">خروج</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "";
        const PHOENIX_KEY = "20102010";

        // 1. جلب الـ IP أولاً
        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip.replace(/\./g, '_'); // تحويل النقط لـ Firebase
                checkIPBan();
            } catch (e) { console.error("IP Error"); showScreen('login-screen'); }
        }

        // 2. فحص هل الـ IP محظور
        function checkIPBan() {
            db.ref('banned_ips/' + userIP).on('value', (snap) => {
                if (snap.exists()) {
                    showScreen('banned-screen');
                } else {
                    const saved = localStorage.getItem('instasoop_session');
                    if (saved) checkStatus(saved);
                    else showScreen('login-screen');
                }
            });
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkStatus(val);
        }

        function checkStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                if (snap.exists()) {
                    // إذا تبندا بالسمية، نبندوه حتى بالـ IP آلياً
                    db.ref('banned_ips/' + userIP).set(true);
                    showScreen('banned-screen');
                } else {
                    if (!currentUser) {
                        currentUser = name;
                        localStorage.setItem('instasoop_session', name);
                        document.getElementById('displayUser').innerText = "@" + name;
                        showScreen('chat-app');
                        trackUser(name);
                        loadMessages();
                    }
                }
            });
        }

        function trackUser(name) {
            db.ref('active_users/' + name).set({ ip: userIP, last: Date.now() });
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;
            if (msg === PHOENIX_KEY) { openAdmin(); input.value = ''; return; }
            db.ref('messages').push({ user: currentUser, text: msg, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            const box = document.getElementById('chat-box');
            db.ref('messages').limitToLast(40).on('value', (snap) => {
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // Admin Panel Logic
        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(child => {
                    const u = child.key;
                    const data = child.val();
                    db.ref('banned_users/' + u).once('value', (bSnap) => {
                        const isB = bSnap.exists();
                        const div = document.createElement('div');
                        div.className = 'admin-item';
                        div.innerHTML = `
                            <div>
                                <strong>${u}</strong>
                                <span class="ip-text">IP: ${data.ip}</span>
                            </div>
                            <button onclick="toggleBan('${u}', '${data.ip}', ${isB})" 
                                style="background:${isB ? '#34c759' : '#ff3b30'}; border:none; color:white; padding:8px 15px; border-radius:8px; font-weight:bold;">
                                ${isB ? 'Unban' : 'BAN IP'}
                            </button>
                        `;
                        list.appendChild(div);
                    });
                });
            });
        }

        function toggleBan(u, ip, isB) {
            if (!isB) {
                db.ref('banned_users/' + u).set(true);
                db.ref('banned_ips/' + ip).set(true);
            } else {
                db.ref('banned_users/' + u).remove();
                db.ref('banned_ips/' + ip).remove();
            }
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        getIP(); // البداية من هنا
    </script>
</body>
</html>
