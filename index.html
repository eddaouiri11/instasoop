<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instasoop | Animated Premium</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --insta-gradient: linear-gradient(-45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --blue-action: #0095f6;
            --text-main: #262626;
            --text-secondary: #8e8e8e;
            --border-color: rgba(219, 219, 219, 0.5);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatIcons {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
            50% { opacity: 0.2; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        html, body { 
            margin: 0; padding: 0; 
            height: 100%; width: 100%; 
            overflow: hidden; 
            background: var(--insta-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
        }

        /* Animated background elements */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-icon {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            animation: floatIcons 10s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-icon svg { fill: white; width: 25px; height: 25px; }

        /* login screen */
        .overlay-screen {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            z-index: 3000;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 28px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
        }

        .insta-logo { 
            font-size: 3.8rem; 
            color: var(--text-main); 
            font-family: 'Grand Hotel', cursive; 
            margin-bottom: 25px; 
            display: block;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 14px 15px;
            border-radius: 12px;
            color: var(--text-main);
            margin-bottom: 15px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: var(--blue-action); background: #fff; }

        .btn-primary {
            width: 100%;
            background: var(--blue-action);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0, 149, 246, 0.4);
        }

        /* App Container */
        #chat-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            position: relative;
            z-index: 5;
        }

        header {
            padding: 0 16px;
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .header-logo {
            font-family: 'Grand Hotel', cursive;
            font-size: 2.2rem;
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.5); /* Semi transparent for bg to show slightly */
            scroll-behavior: smooth;
        }

        /* Message Bubbles */
        .msg { max-width: 82%; display: flex; flex-direction: column; position: relative; }
        .u-name { font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 3px; padding: 0 12px; font-weight: 700; }
        
        .bubble { 
            padding: 12px 18px; 
            border-radius: 22px; 
            font-size: 0.98rem; 
            line-height: 1.4; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sent { align-self: flex-end; }
        .sent .bubble { 
            background: var(--insta-gradient); 
            background-size: 200% 200%;
            animation: gradientBG 5s ease infinite;
            color: white; 
            border-bottom-right-radius: 4px;
        }
        
        .recv { align-self: flex-start; }
        .recv .bubble { 
            background: #ffffff; 
            color: var(--text-main); 
            border-bottom-left-radius: 4px;
            border: 1px solid #f0f0f0;
        }

        /* Bottom Input */
        .input-container {
            padding: 12px 16px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            background: #fff;
            border-top: 1px solid var(--border-color);
        }

        .input-bar {
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            padding: 5px 20px;
            align-items: center;
            background: #fafafa;
        }

        #msgInput {
            border: none;
            background: transparent;
            flex: 1;
            color: var(--text-main);
            padding: 10px 0;
            outline: none;
            font-size: 16px;
        }

        .send-txt {
            color: var(--blue-action);
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            padding-left: 5px;
            transition: 0.2s;
        }

        .send-txt:active { transform: scale(0.9); opacity: 0.7; }

        /* Admin & Banned */
        #banned-screen {
            background: #fff;
            position: fixed; inset: 0;
            z-index: 5000; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 40px; text-align: center;
        }

        #admin-panel {
            position: fixed; inset: 0;
            background: #fff; z-index: 6000;
            display: none; flex-direction: column; padding: 20px;
        }

        .admin-card {
            background: #f8f8f8;
            margin-bottom: 12px;
            padding: 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-box { font-size: 3rem; font-weight: 900; color: var(--blue-action); }
    </style>
</head>
<body>

    <div class="bg-animation" id="bgAnim"></div>

    <!-- Login -->
    <div id="login-screen" class="overlay-screen">
        <div class="login-card">
            <span class="insta-logo">Instasoop</span>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم" maxlength="15">
            <button class="btn-primary" onclick="startApp()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- Banned -->
    <div id="banned-screen">
        <div style="font-size: 6rem;">🚫</div>
        <h2>حسابك مقيد</h2>
        <p style="color: var(--text-secondary);">تم حظرك مؤقتاً لمخالفة معايير مجتمع Instasoop.</p>
        <div id="timer-display" class="timer-box">00</div>
        <p style="color: var(--text-secondary);">انتظر حتى ينتهي الوقت</p>
    </div>

    <!-- Main App -->
    <div id="chat-app">
        <header>
            <div class="header-logo">Instasoop</div>
            <div id="displayUser" style="color: var(--blue-action); font-weight: 800; font-size: 0.9rem; background: rgba(0,149,246,0.1); padding: 5px 12px; border-radius: 15px;"></div>
        </header>
        
        <div id="chat-box"></div>
        
        <div class="input-container">
            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="مراسلة..." autocomplete="off">
                <div class="send-txt" onclick="send()">إرسال</div>
            </div>
        </div>
    </div>

    <!-- Admin -->
    <div id="admin-panel">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin:0;">الإشراف والتحكم</h2>
            <button onclick="closeAdmin()" style="background:#eee; border:none; width:40px; height:40px; border-radius:50%; font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
        <div style="display:flex; gap: 10px; margin-bottom: 20px;">
            <button onclick="unbanAll()" style="flex:1; padding:14px; border-radius:15px; border:1px solid #ddd; background:#fff; font-weight:600;">فك حظر الجميع</button>
            <button onclick="nuclearWipe()" style="flex:1; padding:14px; border-radius:15px; background:#ed4956; color:white; border:none; font-weight:600;">مسح الشات</button>
        </div>
        <div id="admin-list" style="overflow-y:auto; flex:1;"></div>
    </div>

    <script>
        // Create floating background icons
        function createBgIcons() {
            const container = document.getElementById('bgAnim');
            const iconSvg = `<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c.796 0 1.441.645 1.441 1.44s-.645 1.44-1.441 1.44c-.795 0-1.439-.645-1.439-1.44s.644-1.44 1.439-1.44z"/></svg>`;
            for(let i=0; i<15; i++) {
                const div = document.createElement('div');
                div.className = 'floating-icon';
                div.style.left = Math.random() * 100 + 'vw';
                div.style.animationDuration = (Math.random() * 5 + 7) + 's';
                div.style.animationDelay = (Math.random() * 5) + 's';
                div.innerHTML = iconSvg;
                container.appendChild(div);
            }
        }
        createBgIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let userIP = "Unknown";
        const ADMIN_CODE = "20102010";

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                userIP = data.ip;
            } catch (e) {}

            const saved = localStorage.getItem('instasoop_session');
            if (saved) checkUserStatus(saved);
            else showScreen('login-screen');
        }

        function startApp() {
            const val = document.getElementById('usernameInput').value.trim();
            if (val.length >= 2) checkUserStatus(val);
        }

        function checkUserStatus(name) {
            db.ref('banned_users/' + name).on('value', (snap) => {
                const ban = snap.val();
                if (ban) {
                    const now = Date.now();
                    if (ban.expiry && now > ban.expiry) {
                        db.ref('banned_users/' + name).remove();
                    } else {
                        showScreen('banned-screen');
                        if (ban.expiry) startTimer(ban.expiry);
                        return;
                    }
                }
                
                if (!currentUser) {
                    currentUser = name;
                    localStorage.setItem('instasoop_session', name);
                    document.getElementById('displayUser').innerText = "@" + name.toLowerCase();
                    showScreen('chat-app');
                    db.ref('active_users/' + name).set({ ip: userIP, ts: Date.now() });
                    loadMessages();
                }
            });
        }

        function startTimer(expiry) {
            const disp = document.getElementById('timer-display');
            const timer = setInterval(() => {
                const diff = expiry - Date.now();
                if (diff <= 0) { clearInterval(timer); location.reload(); }
                else { disp.innerText = Math.floor(diff/1000); }
            }, 1000);
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen, #chat-app, #banned-screen').forEach(s => s.style.display = 'none');
            const el = document.getElementById(id);
            if(el) el.style.display = 'flex';
        }

        function send() {
            const input = document.getElementById('msgInput');
            const txt = input.value.trim();
            if (txt === ADMIN_CODE) { openAdmin(); input.value = ''; return; }
            if (!txt) return;
            db.ref('messages').push({ user: currentUser, text: txt, ts: Date.now() });
            input.value = '';
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = '';
                snap.forEach(c => {
                    const d = c.val();
                    const isMe = d.user === currentUser;
                    const div = document.createElement('div');
                    div.className = `msg ${isMe ? 'sent' : 'recv'}`;
                    div.innerHTML = `<span class="u-name">${d.user}</span><div class="bubble">${d.text}</div>`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function openAdmin() {
            document.getElementById('admin-panel').style.display = 'flex';
            const list = document.getElementById('admin-list');
            db.ref('active_users').on('value', (snap) => {
                list.innerHTML = '';
                snap.forEach(u => {
                    const n = u.key;
                    const div = document.createElement('div');
                    div.className = 'admin-card';
                    div.innerHTML = `<div><div style="font-weight:bold;">${n}</div><div style="font-size:0.7rem;color:#888;">${u.val().ip}</div></div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="applyBan('${n}', 60)" style="padding:8px 12px; border-radius:10px; border:1px solid #ddd; background:#fff; cursor:pointer;">1د</button>
                        <button onclick="applyBan('${n}', 0)" style="padding:8px 12px; border-radius:10px; background:#ed4956; color:white; border:none; cursor:pointer;">طرد</button>
                    </div>`;
                    list.appendChild(div);
                });
            });
        }

        function applyBan(name, sec) {
            const exp = sec === 0 ? null : Date.now() + (sec * 1000);
            db.ref('banned_users/' + name).set({ banned: true, expiry: exp });
        }

        function unbanAll() { db.ref('banned_users').remove(); }
        function nuclearWipe() { if(confirm("تصفية كل المحادثات؟")) db.ref('messages').remove(); }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

        init();
    </script>
</body>
</html>
