<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instasoop | Luxury Messenger</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --bg: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * { 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-large { font-size: 3rem; margin-bottom: 10px; }

        input {
            width: 100%;
            background: #0f172a;
            border: 2px solid #334155;
            padding: 15px;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            margin: 20px 0;
            outline: none;
            text-align: center;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.2); }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.4);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(124, 58, 237, 0.5); }

        /* Main Chat Layout */
        #chat-app {
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            display: none;
            flex-direction: column;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        header {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 0 0 10px #10b981;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Message Styling */
        .message-row { 
            display: flex; 
            flex-direction: column; 
            max-width: 85%; 
            position: relative; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .received { align-self: flex-start; }
        .sent { align-self: flex-end; }

        .user-tag { font-size: 0.7rem; margin-bottom: 4px; color: var(--text-dim); font-weight: 600; padding: 0 8px; }
        .sent .user-tag { text-align: left; margin-right: auto; margin-left: 8px; color: var(--primary); }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            word-break: break-word;
        }

        .received .bubble { background: var(--surface); border-bottom-right-radius: 4px; color: #e2e8f0; }
        .sent .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-bottom-left-radius: 4px; color: white; }

        .time { font-size: 0.6rem; margin-top: 4px; opacity: 0.5; align-self: flex-end; padding: 0 5px; }

        /* Input Area */
        .input-container {
            padding: 15px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        #msgInput { 
            margin: 0; 
            text-align: right; 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 12px 15px;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
        }

        /* Custom Scrollbar */
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Responsive Fixes for Desktop */
        @media (min-width: 768px) {
            #chat-app {
                height: 90vh;
                border-radius: 30px;
                box-shadow: 0 0 100px rgba(0,0,0,0.5);
            }
            .bubble { font-size: 1rem; }
            .message-row { max-width: 70%; }
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول -->
    <div id="login-screen">
        <div class="login-card">
            <div class="logo-large">🥣</div>
            <h1 style="margin:0; font-size: 1.8rem;">Instasoop</h1>
            <p style="color: var(--text-dim); margin-top: 5px;">مرحباً بك في عالم المحادثة الفاخرة</p>
            <input type="text" id="usernameInput" placeholder="ادخل اسمك المستعار..." maxlength="15">
            <button class="btn-primary" onclick="startApp()">دخول الشات</button>
        </div>
    </div>

    <!-- واجهة الشات الرئيسية -->
    <div id="chat-app">
        <header>
            <div style="display:flex; align-items:center;">
                <span style="font-weight:bold; letter-spacing: 1px; font-size: 0.9rem;">INSTASOOP</span>
                <span style="margin: 0 8px; opacity: 0.2;">|</span>
                <span id="displayUser" style="color: var(--primary); font-weight: 600; font-size: 0.9rem;"></span>
            </div>
            <div style="display:flex; align-items:center; font-size: 0.75rem; color: var(--text-dim);">
                <span class="status-dot"></span>
                <span>متصل</span>
            </div>
        </header>

        <div id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key === 'Enter') send()">
            <button class="send-btn" onclick="send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDuscs-L7y5aNwBX6zzz95XU3qGrF4ZsSk",
            authDomain: "instasoop-230e0.firebaseapp.com",
            projectId: "instasoop-230e0",
            storageBucket: "instasoop-230e0.firebasestorage.app",
            messagingSenderId: "968767111628",
            appId: "1:968767111628:web:4b79cdd708b1a32ba69d69"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";

        // Focus on input when login screen appears
        window.onload = () => {
            document.getElementById('usernameInput').focus();
        };

        function startApp() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name.length < 2) {
                alert("المرجو إدخال اسم حقيقي (حرفين على الأقل)");
                return;
            }
            currentUser = name;
            document.getElementById('displayUser').innerText = currentUser;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('chat-app').style.display = 'flex';
            loadMessages();
        }

        function send() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text) {
                db.ref('messages').push({
                    user: currentUser,
                    text: text,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})
                });
                input.value = '';
                input.focus();
            }
        }

        function loadMessages() {
            db.ref('messages').limitToLast(50).on('value', (snapshot) => {
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';
                snapshot.forEach((child) => {
                    const data = child.val();
                    const isMe = data.user === currentUser;
                    
                    const row = document.createElement('div');
                    row.className = `message-row ${isMe ? 'sent' : 'received'}`;
                    
                    row.innerHTML = `
                        <span class="user-tag">${data.user}</span>
                        <div class="bubble">${data.text}</div>
                        <span class="time">${data.time || ''}</span>
                    `;
                    chatBox.appendChild(row);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
